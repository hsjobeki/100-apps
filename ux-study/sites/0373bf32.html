<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Service health</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#090d12;
    --panel:#111821;
    --panel2:#18212c;
    --line:#233042;
    --line2:#2e3d51;
    --text:#e7eef7;
    --dim:#8a9bb0;
    --dim2:#61748a;
    --ok:#3ddc84;
    --warn:#ffb020;
    --bad:#ff5d5d;
    --accent:#4c9aff;
    --r:10px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  button:disabled{cursor:default}
  h1,h2,h3{margin:0;font-weight:600}

  /* ---------- top bar ---------- */
  header#top{
    position:sticky;top:0;z-index:30;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:12px 20px;
    background:rgba(9,13,18,.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px;margin-right:auto}
  .brand h1{font-size:15px;letter-spacing:.2px}
  .logo{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;background:linear-gradient(140deg,#1d2b3d,#16202b);border:1px solid var(--line2);color:var(--accent)}
  .live{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:12px;font-family:"JetBrains Mono",ui-monospace,monospace}
  .live i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(61,220,132,.55);animation:pulse 2.4s infinite}
  .live.paused i{background:var(--dim2);animation:none;box-shadow:none}
  .live.err i{background:var(--bad);animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,132,.5)}70%{box-shadow:0 0 0 6px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
  .controls{display:flex;align-items:center;gap:8px}
  .seg{display:flex;padding:2px;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:9px}
  .seg button{padding:5px 11px;border-radius:7px;font-size:12px;font-weight:500;color:var(--dim);font-family:"JetBrains Mono",ui-monospace,monospace}
  .seg button:hover:not(:disabled){color:var(--text);background:var(--panel2)}
  .seg button[aria-pressed="true"]{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
  .seg button:disabled{opacity:.5}
  .icon{
    position:relative;display:grid;place-items:center;width:32px;height:32px;border-radius:9px;
    background:var(--panel);border:1px solid var(--line);color:var(--dim);
  }
  .icon:hover:not(:disabled){color:var(--text);border-color:var(--line2)}
  .icon:disabled{opacity:.55}
  .icon .ring{position:absolute;inset:-1px;transform:rotate(-90deg);pointer-events:none}
  .icon .ring circle{fill:none;stroke-width:2}
  .icon .ring .trk{stroke:rgba(76,154,255,.13)}
  .icon .ring .val{stroke:var(--accent);opacity:.8;transition:stroke-dashoffset .5s linear}
  .icon.spin svg.ic{animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loadbar{position:absolute;left:0;right:0;bottom:-1px;height:2px;overflow:hidden;background:rgba(76,154,255,.14)}
  .loadbar i{position:absolute;top:0;bottom:0;width:38%;background:var(--accent);border-radius:2px;animation:slide 1.1s cubic-bezier(.4,0,.2,1) infinite}
  @keyframes slide{0%{left:-40%}100%{left:100%}}
  .loadbar[hidden]{display:none}

  main{max-width:1320px;margin:0 auto;padding:18px 20px 64px}

  /* ---------- summary ---------- */
  .summary{
    display:flex;align-items:center;gap:22px;flex-wrap:wrap;
    padding:16px 18px;margin-bottom:14px;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  }
  .summary.bad{border-color:rgba(255,93,93,.45);background:linear-gradient(90deg,rgba(255,93,93,.09),var(--panel) 55%)}
  .summary.warn{border-color:rgba(255,176,32,.4);background:linear-gradient(90deg,rgba(255,176,32,.07),var(--panel) 55%)}
  .halo{position:relative;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;flex:none}
  .halo.ok{background:rgba(61,220,132,.14);color:var(--ok)}
  .halo.warn{background:rgba(255,176,32,.14);color:var(--warn)}
  .halo.bad{background:rgba(255,93,93,.15);color:var(--bad);animation:halo 1.8s ease-out infinite}
  .halo.unk{background:rgba(138,155,176,.13);color:var(--dim)}
  @keyframes halo{0%{box-shadow:0 0 0 0 rgba(255,93,93,.4)}70%{box-shadow:0 0 0 12px rgba(255,93,93,0)}100%{box-shadow:0 0 0 0 rgba(255,93,93,0)}}
  .sum-head{display:flex;flex-direction:column;gap:2px;min-width:150px}
  .sum-head h2{font-size:20px;letter-spacing:-.2px}
  .sum-head span{font-size:12px;color:var(--dim)}
  .hbar{display:flex;gap:2px;height:10px;flex:1 1 220px;min-width:180px;border-radius:5px;overflow:hidden;background:var(--panel2)}
  .hbar span{height:100%;transition:width .35s ease}
  .hbar .s-ok{background:var(--ok)}
  .hbar .s-warn{background:var(--warn)}
  .hbar .s-bad{background:var(--bad)}
  .hbar .s-unk{background:var(--dim2)}
  .counts{display:flex;gap:8px;flex-wrap:wrap}
  .cnt{
    display:flex;align-items:center;gap:8px;padding:6px 11px;border-radius:9px;
    background:var(--panel2);border:1px solid transparent;font-size:12px;color:var(--dim);
  }
  .cnt:hover{border-color:var(--line2)}
  .cnt[aria-pressed="true"]{border-color:var(--line2);color:var(--text);background:#1f2a37}
  .cnt b{font-family:"JetBrains Mono",monospace;font-size:15px;font-weight:600;color:var(--text)}
  .cnt .dot{width:8px;height:8px}
  .dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)} .dot.unk{background:var(--dim2)}

  /* ---------- banner ---------- */
  .banner{
    display:flex;align-items:center;gap:12px;
    padding:11px 14px;margin-bottom:14px;border-radius:var(--r);
    border:1px solid rgba(255,176,32,.4);background:rgba(255,176,32,.07);
    font-size:13px;
  }
  .banner .bi{flex:none;display:grid;place-items:center;color:var(--warn)}
  .banner p{margin:0;color:var(--text)}
  .banner .sub{color:var(--dim);font-size:12px}
  .banner .btn{margin-left:auto}
  .btn{
    display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:8px;
    background:var(--panel2);border:1px solid var(--line2);color:var(--text);font-size:12.5px;font-weight:500;
  }
  .btn:hover:not(:disabled){background:#243040;border-color:#3a4c63}
  .btn:disabled{opacity:.55}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#05101f}
  .btn.primary:hover:not(:disabled){background:#63a9ff}

  /* ---------- panels ---------- */
  .panel{
    display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;
    padding:56px 24px;border:1px dashed var(--line2);border-radius:var(--r);background:var(--panel);
  }
  .panel h3{font-size:15px}
  .panel p{margin:0;color:var(--dim);font-size:13px;max-width:380px}
  .panel .code{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--dim2)}

  /* ---------- grid ---------- */
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
  .card{
    display:block;text-align:left;width:100%;
    padding:14px 15px 15px;border-radius:var(--r);
    background:var(--panel);border:1px solid var(--line);
    border-left:3px solid var(--dim2);
    transition:border-color .15s,transform .15s,background .15s;
  }
  .card:hover{background:var(--panel2);transform:translateY(-1px)}
  .card.ok{border-left-color:var(--ok)}
  .card.warn{border-left-color:var(--warn)}
  .card.bad{border-left-color:var(--bad);background:linear-gradient(180deg,rgba(255,93,93,.07),transparent 60%),var(--panel)}
  .card-h{display:flex;align-items:center;gap:9px;margin-bottom:14px}
  .card-h .name{font-weight:600;font-size:14px;letter-spacing:-.1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip{
    margin-left:auto;display:inline-flex;align-items:center;gap:5px;flex:none;
    padding:3px 8px;border-radius:999px;font-size:10.5px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;
  }
  .chip.ok{background:rgba(61,220,132,.13);color:var(--ok)}
  .chip.warn{background:rgba(255,176,32,.13);color:var(--warn)}
  .chip.bad{background:rgba(255,93,93,.15);color:var(--bad)}
  .chip.unk{background:var(--panel2);color:var(--dim)}
  .metric{display:block;margin-top:10px}
  .mrow{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
  .k{font-size:11px;color:var(--dim);letter-spacing:.3px}
  .v{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
  .v i{font-style:normal;font-size:10.5px;font-weight:500;color:var(--dim);margin-left:2px}
  .trend{display:inline-flex;align-items:center;gap:3px;font-family:"JetBrains Mono",monospace;font-size:10.5px;flex:none}
  .t-bad{color:var(--bad)} .t-ok{color:var(--ok)} .t-flat{color:var(--dim2)}
  .spark{display:block;width:100%;height:38px}
  .bars{display:block;width:100%;height:26px}
  .up{margin-top:13px;padding-top:11px;border-top:1px solid var(--line)}
  .up .mrow{margin-bottom:6px}
  .up .v{font-size:13px}
  meter{-webkit-appearance:none;appearance:none;display:block;width:100%;height:6px}
  meter::-webkit-meter-bar{background:#1d2836;border:0;border-radius:3px}
  meter::-webkit-meter-optimum-value{background:var(--ok);border-radius:3px}
  meter::-webkit-meter-suboptimum-value{background:var(--warn);border-radius:3px}
  meter::-webkit-meter-even-less-good-value{background:var(--bad);border-radius:3px}
  .nodata{display:grid;place-items:center;height:38px;color:var(--dim2);font-family:"JetBrains Mono",monospace;font-size:11px}

  /* ---------- skeleton ---------- */
  .skel{pointer-events:none;border-left-color:var(--line)}
  .sk{display:block;border-radius:6px;background:linear-gradient(90deg,#182029 25%,#1f2a36 37%,#182029 63%);background-size:400% 100%;animation:shimmer 1.3s ease infinite}
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}

  /* ---------- drawer ---------- */
  .scrim{position:fixed;inset:0;background:rgba(5,8,12,.6);z-index:40;animation:fade .15s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .drawer{
    position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);z-index:41;
    background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;animation:slidein .18s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes slidein{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
  .dhead{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .dhead h2{font-size:16px}
  .dhead .chip{margin-left:0}
  .dbody{padding:18px;overflow:auto;display:flex;flex-direction:column;gap:14px}
  .block{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:14px}
  .block header{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
  .block header .k{font-size:12px;color:var(--text);font-weight:600}
  .block header .rng{margin-left:auto;font-size:11px;color:var(--dim2);font-family:"JetBrains Mono",monospace}
  .big{display:block;width:100%;height:auto}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
  .stat{display:flex;flex-direction:column;gap:2px}
  .stat .k{font-size:10px;text-transform:uppercase;letter-spacing:.5px}
  .stat .n{font-family:"JetBrains Mono",monospace;font-size:14px;font-weight:600}
  .uprow{display:flex;align-items:center;gap:14px}
  .uprow .n{font-family:"JetBrains Mono",monospace;font-size:22px;font-weight:600}
  .scale{display:flex;justify-content:space-between;font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--dim2);margin-top:4px}

  @media (max-width:640px){
    header#top{gap:10px;padding:10px 14px}
    .brand h1{font-size:14px}
    .controls{width:100%;order:3}
    .seg{flex:1}
    .seg button{flex:1;text-align:center}
    main{padding:14px 14px 48px}
    .summary{gap:14px;padding:14px}
    .sum-head{min-width:0;flex:1}
    .hbar{order:5;flex-basis:100%}
    .counts{order:4;width:100%}
    .cnt{flex:1;justify-content:center}
    .grid{grid-template-columns:1fr}
    .stats{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<header id="top">
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
    </span>
    <h1>Service health</h1>
  </div>
  <span class="live" id="live"><i></i><span id="ago">&mdash;</span></span>
  <div class="controls">
    <div class="seg" id="ranges" role="group" aria-label="Time range">
      <button type="button" data-range="1h" aria-pressed="false">1h</button>
      <button type="button" data-range="24h" aria-pressed="true">24h</button>
      <button type="button" data-range="7d" aria-pressed="false">7d</button>
    </div>
    <button type="button" class="icon" id="pause" title="Pause auto-refresh" aria-label="Pause auto-refresh" aria-pressed="false">
      <svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </button>
    <button type="button" class="icon" id="refresh" title="Refresh" aria-label="Refresh">
      <svg class="ring" width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
        <circle class="trk" cx="16" cy="16" r="14"/>
        <circle class="val" id="ringval" cx="16" cy="16" r="14" stroke-linecap="round"/>
      </svg>
      <svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
    </button>
  </div>
  <div class="loadbar" id="bar" role="progressbar" aria-label="Loading metrics" hidden><i></i></div>
</header>

<main>
  <section id="summary" class="summary" aria-live="polite"></section>
  <div id="banner"></div>
  <section id="grid" class="grid"></section>
</main>

<div id="drawer-root"></div>

<script>
(function () {
  'use strict';

  var api = window.api;
  var POLL_MS = 10000;
  var C = { ok: '#3ddc84', warn: '#ffb020', bad: '#ff5d5d', unk: '#8a9bb0', line: '#2e3d51', dim: '#8a9bb0' };
  var RANK = { down: 0, degraded: 1, healthy: 2 };
  var META = {
    down:     { label: 'Down',     cls: 'bad'  },
    degraded: { label: 'Degraded', cls: 'warn' },
    healthy:  { label: 'Healthy',  cls: 'ok'   }
  };

  var state = {
    range: '24h',
    dataRange: null,
    services: null,
    errScale: 100,
    updatedAt: 0,
    loading: false,
    error: null,
    filter: 'all',
    selected: null,
    paused: false,
    nextPollAt: 0
  };

  var el = {
    live: document.getElementById('live'),
    ago: document.getElementById('ago'),
    bar: document.getElementById('bar'),
    ring: document.getElementById('ringval'),
    summary: document.getElementById('summary'),
    banner: document.getElementById('banner'),
    grid: document.getElementById('grid'),
    ranges: document.getElementById('ranges'),
    refresh: document.getElementById('refresh'),
    pause: document.getElementById('pause'),
    drawerRoot: document.getElementById('drawer-root')
  };

  var RING_C = 2 * Math.PI * 14;
  el.ring.setAttribute('stroke-dasharray', RING_C.toFixed(2));
  el.ring.setAttribute('stroke-dashoffset', RING_C.toFixed(2));

  /* ------------------------------------------------------------------ utils */

  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function meta(status) {
    return META[status] || { label: String(status || 'Unknown'), cls: 'unk' };
  }
  function rank(status) { return RANK[status] === undefined ? 3 : RANK[status]; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function nums(arr) {
    var out = [], i;
    if (!arr || !arr.length) return out;
    for (i = 0; i < arr.length; i++) if (typeof arr[i] === 'number' && isFinite(arr[i])) out.push(arr[i]);
    return out;
  }
  function avg(a) { var s = 0, i; for (i = 0; i < a.length; i++) s += a[i]; return s / a.length; }

  var _uid = 0;
  function uid() { _uid += 1; return 'grd' + _uid; }

  function errScaleFor(services) {
    var max = 0;
    (services || []).forEach(function (s) {
      nums(s.errorRate).forEach(function (v) { if (v > max) max = v; });
    });
    return max <= 1 ? 100 : 1;
  }
  function fmtErr(v) {
    if (typeof v !== 'number' || !isFinite(v)) return '&mdash;';
    var p = v * state.errScale;
    return (p >= 10 ? p.toFixed(1) : p.toFixed(2)) + '<i>%</i>';
  }
  function fmtLat(v) {
    if (typeof v !== 'number' || !isFinite(v)) return '&mdash;';
    return v >= 1000 ? (v / 1000).toFixed(2) + '<i>s</i>' : Math.round(v) + '<i>ms</i>';
  }
  function ago(ms) {
    var s = Math.max(0, Math.round((Date.now() - ms) / 1000));
    if (s < 3) return 'now';
    if (s < 60) return s + 's ago';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    return Math.floor(s / 3600) + 'h ago';
  }
  function errText(e) {
    if (!e) return 'Unknown error';
    if (e.code === 'NETWORK') return 'Metrics API unreachable';
    if (e.name === 'AbortError') return 'Request cancelled';
    return e.message || 'Request failed';
  }

  /* ----------------------------------------------------------------- charts */

  function lineChart(vals, color) {
    var v = nums(vals);
    if (v.length < 2) return '<span class="nodata">no series</span>';
    var w = 200, h = 40, pad = 4;
    var min = Math.min.apply(null, v), max = Math.max.apply(null, v);
    var span = (max - min) || 1;
    var x = function (i) { return (i / (v.length - 1)) * w; };
    var y = function (n) { return pad + (1 - (n - min) / span) * (h - 2 * pad); };
    var d = '', i;
    for (i = 0; i < v.length; i++) d += (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v[i]).toFixed(1) + ' ';
    var area = d + 'L' + w + ' ' + h + ' L0 ' + h + ' Z';
    var g = uid();
    return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true">' +
      '<defs><linearGradient id="' + g + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="' + color + '" stop-opacity="0.32"/>' +
      '<stop offset="1" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>' +
      '<path d="' + area + '" fill="url(#' + g + ')"/>' +
      '<path d="' + d.trim() + '" fill="none" stroke="' + color + '" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
      '<circle cx="' + x(v.length - 1).toFixed(1) + '" cy="' + y(v[v.length - 1]).toFixed(1) + '" r="2.4" fill="' + color + '" vector-effect="non-scaling-stroke"/>' +
      '</svg>';
  }

  function barChart(vals, color) {
    var v = nums(vals);
    if (!v.length) return '<span class="nodata">no series</span>';
    var w = 200, h = 26;
    var max = Math.max.apply(null, v) || 1;
    var gap = v.length > 60 ? 0 : 1;
    var bw = (w - gap * (v.length - 1)) / v.length;
    var out = '', i, bh, yy, ratio;
    for (i = 0; i < v.length; i++) {
      ratio = v[i] / max;
      bh = Math.max(1.2, ratio * (h - 2));
      yy = h - bh;
      out += '<rect x="' + (i * (bw + gap)).toFixed(2) + '" y="' + yy.toFixed(2) +
        '" width="' + bw.toFixed(2) + '" height="' + bh.toFixed(2) +
        '" fill="' + color + '" fill-opacity="' + (0.35 + 0.65 * ratio).toFixed(2) + '" rx="0.6"/>';
    }
    return '<svg class="bars" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true">' + out + '</svg>';
  }

  function trendEl(vals) {
    var v = nums(vals);
    if (v.length < 4) return '';
    var k = Math.max(1, Math.floor(v.length / 3));
    var a = avg(v.slice(0, k)), b = avg(v.slice(-k));
    if (!isFinite(a) || a === 0) return '';
    var pct = ((b - a) / a) * 100;
    var dir = pct > 8 ? 'up' : (pct < -8 ? 'down' : 'flat');
    var cls = dir === 'up' ? 't-bad' : (dir === 'down' ? 't-ok' : 't-flat');
    var path = dir === 'up' ? 'M2 9L6 4l4 5' : (dir === 'down' ? 'M2 4l4 5 4-5' : 'M2 6.5h8');
    var label = (Math.abs(pct) < 1 ? '0' : (pct > 0 ? '+' : '') + Math.round(pct)) + '%';
    return '<span class="trend ' + cls + '" title="' + label + ' across range">' +
      '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="' + path +
      '" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      label + '</span>';
  }

  function bigChart(vals, color, kind) {
    var v = nums(vals);
    if (v.length < 2) return '<span class="nodata">no series</span>';
    var w = 600, h = 150, padL = 50, padR = 10, padT = 12, padB = 14;
    var min = Math.min.apply(null, v), max = Math.max.apply(null, v);
    var span = (max - min) || 1;
    var iw = w - padL - padR, ih = h - padT - padB;
    var x = function (i) { return padL + (i / (v.length - 1)) * iw; };
    var y = function (n) { return padT + (1 - (n - min) / span) * ih; };
    var d = '', i;
    for (i = 0; i < v.length; i++) d += (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v[i]).toFixed(1) + ' ';
    var area = d + 'L' + x(v.length - 1).toFixed(1) + ' ' + (padT + ih) + ' L' + padL + ' ' + (padT + ih) + ' Z';
    var g = uid();
    var lab = function (n) { return kind === 'err' ? (n * state.errScale).toFixed(2) + '%' : Math.round(n) + 'ms'; };
    var lines = '';
    [0, 0.5, 1].forEach(function (f) {
      var yy = padT + f * ih;
      lines += '<line x1="' + padL + '" y1="' + yy.toFixed(1) + '" x2="' + (w - padR) + '" y2="' + yy.toFixed(1) +
        '" stroke="' + C.line + '" stroke-width="1"' + (f === 1 ? '' : ' stroke-dasharray="3 4"') + '/>' +
        '<text x="' + (padL - 8) + '" y="' + (yy + 3.5).toFixed(1) + '" text-anchor="end" font-size="10" fill="' + C.dim +
        '" font-family="JetBrains Mono, monospace">' + lab(max - f * span) + '</text>';
    });
    return '<svg class="big" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true">' +
      '<defs><linearGradient id="' + g + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="' + color + '" stop-opacity="0.3"/>' +
      '<stop offset="1" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>' +
      lines +
      '<path d="' + area + '" fill="url(#' + g + ')"/>' +
      '<path d="' + d.trim() + '" fill="none" stroke="' + color + '" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<circle cx="' + x(v.length - 1).toFixed(1) + '" cy="' + y(v[v.length - 1]).toFixed(1) + '" r="3" fill="' + color + '"/>' +
      '</svg>';
  }

  /* ------------------------------------------------------------------ icons */

  var ICON = {
    ok: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
    warn: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 1.8 20.5h20.4L12 3Z"/><path d="M12 9.5v5"/><path d="M12 18h.01"/></svg>',
    bad: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
    unk: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v4.5"/><path d="M12 16.5h.01"/></svg>',
    tiny: {
      ok: '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
      warn: '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 1.8 20.5h20.4L12 3Z"/></svg>',
      bad: '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
      unk: '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/></svg>'
    }
  };

  /* -------------------------------------------------------------- renderers */

  function sortedServices() {
    var list = (state.services || []).slice();
    list.sort(function (a, b) {
      var d = rank(a.status) - rank(b.status);
      if (d) return d;
      return String(a.name).localeCompare(String(b.name));
    });
    return list;
  }

  function counts() {
    var c = { down: 0, degraded: 0, healthy: 0, other: 0 };
    (state.services || []).forEach(function (s) {
      if (c[s.status] === undefined) c.other += 1; else c[s.status] += 1;
    });
    return c;
  }

  /* true when nothing on screen describes the currently selected range */
  function noCurrentData() {
    return !state.services || state.dataRange !== state.range;
  }

  function renderSummary() {
    if (state.loading && noCurrentData()) {
      el.summary.className = 'summary';
      el.summary.innerHTML =
        '<span class="sk" style="width:46px;height:46px;border-radius:50%;flex:none"></span>' +
        '<span class="sum-head"><span class="sk" style="width:130px;height:20px;margin-bottom:6px"></span>' +
        '<span class="sk" style="width:90px;height:11px"></span></span>' +
        '<span class="sk" style="flex:1 1 200px;height:10px"></span>' +
        '<span class="sk" style="width:250px;height:30px"></span>';
      return;
    }
    if (noCurrentData()) {
      el.summary.className = 'summary';
      el.summary.innerHTML =
        '<span class="halo unk">' + ICON.unk + '</span>' +
        '<span class="sum-head"><h2>Unknown</h2><span>' +
        esc(state.error ? state.error.text : 'no data yet') + '</span></span>';
      return;
    }

    var c = counts();
    var total = state.services.length;
    var impacted = c.down + c.degraded + c.other;
    var worst = c.down ? 'bad' : ((c.degraded || c.other) ? 'warn' : 'ok');
    var head = c.down ? 'Outage' : (c.degraded ? 'Degraded' : (total ? 'All healthy' : 'No services'));
    var sub = total === 0 ? 'nothing monitored'
      : (impacted ? impacted + ' of ' + total + ' impacted' : total + ' of ' + total + ' healthy');

    var segs = '';
    [['bad', c.down], ['warn', c.degraded], ['unk', c.other], ['ok', c.healthy]].forEach(function (p) {
      if (p[1] > 0) segs += '<span class="s-' + p[0] + '" style="width:' + ((p[1] / total) * 100).toFixed(2) + '%"></span>';
    });

    function chip(key, cls, label, n) {
      return '<button type="button" class="cnt" data-filter="' + key + '" aria-pressed="' +
        (state.filter === key) + '"><span class="dot ' + cls + '"></span><b>' + n + '</b>' + label + '</button>';
    }

    el.summary.className = 'summary ' + worst;
    el.summary.innerHTML =
      '<span class="halo ' + worst + '">' + ICON[worst] + '</span>' +
      '<span class="sum-head"><h2>' + head + '</h2><span>' + sub + '</span></span>' +
      '<span class="hbar" role="img" aria-label="' + c.down + ' down, ' + c.degraded + ' degraded, ' + c.healthy + ' healthy">' +
      segs + '</span>' +
      '<span class="counts">' +
        chip('down', 'bad', 'Down', c.down) +
        chip('degraded', 'warn', 'Degraded', c.degraded) +
        chip('healthy', 'ok', 'Healthy', c.healthy) +
      '</span>';
  }

  function renderBanner() {
    /* data is still on screen but the most recent refresh failed */
    if (state.error && !noCurrentData()) {
      el.banner.innerHTML =
        '<div class="banner"><span class="bi">' + ICON.warn + '</span>' +
        '<p>' + esc(state.error.text) + '<br><span class="sub">' + esc(state.error.code) +
        ' &middot; showing data from ' + ago(state.updatedAt) + '</span></p>' +
        '<button type="button" class="btn" data-act="retry"' + (state.loading ? ' disabled' : '') + '>' +
        (state.loading ? 'Retrying' : 'Retry') + '</button></div>';
      return;
    }
    el.banner.innerHTML = '';
  }

  function card(s) {
    var m = meta(s.status);
    var color = C[m.cls];
    var lat = nums(s.latencyMs), er = nums(s.errorRate);
    var latNow = lat.length ? lat[lat.length - 1] : null;
    var erNow = er.length ? er[er.length - 1] : null;
    var up = typeof s.uptimePct === 'number' ? s.uptimePct : null;
    return '<button type="button" class="card ' + m.cls + '" data-svc="' + esc(s.name) + '">' +
      '<span class="card-h"><span class="dot ' + m.cls + '"></span>' +
      '<span class="name">' + esc(s.name) + '</span>' +
      '<span class="chip ' + m.cls + '">' + ICON.tiny[m.cls] + m.label + '</span></span>' +

      '<span class="metric"><span class="mrow"><span class="k">Latency</span>' + trendEl(lat) +
      '<span class="v">' + fmtLat(latNow) + '</span></span>' + lineChart(lat, color) + '</span>' +

      '<span class="metric"><span class="mrow"><span class="k">Errors</span>' + trendEl(er) +
      '<span class="v">' + fmtErr(erNow) + '</span></span>' + barChart(er, color) + '</span>' +

      '<span class="metric up"><span class="mrow"><span class="k">Uptime</span>' +
      '<span class="v">' + (up === null ? '&mdash;' : up.toFixed(2) + '<i>%</i>') + '</span></span>' +
      (up === null ? '' : '<meter min="95" max="100" low="99" high="99.9" optimum="100" value="' +
        clamp(up, 95, 100).toFixed(3) + '"></meter>') + '</span>' +
      '</button>';
  }

  function skeletonCard() {
    return '<div class="card skel" aria-hidden="true">' +
      '<span class="card-h"><span class="sk" style="width:9px;height:9px;border-radius:50%"></span>' +
      '<span class="sk" style="width:104px;height:13px"></span>' +
      '<span class="sk" style="width:64px;height:16px;margin-left:auto;border-radius:999px"></span></span>' +
      '<span class="metric"><span class="sk" style="width:100%;height:13px;margin-bottom:6px"></span>' +
      '<span class="sk" style="width:100%;height:38px"></span></span>' +
      '<span class="metric"><span class="sk" style="width:100%;height:13px;margin-bottom:6px"></span>' +
      '<span class="sk" style="width:100%;height:26px"></span></span>' +
      '<span class="metric up"><span class="sk" style="width:100%;height:6px"></span></span></div>';
  }

  function renderGrid() {
    /* never present one range's data as another's */
    if (state.loading && noCurrentData()) {
      var sk = '', i;
      for (i = 0; i < 6; i++) sk += skeletonCard();
      el.grid.innerHTML = sk;
      return;
    }
    if (state.error && noCurrentData()) {
      el.grid.innerHTML =
        '<div class="panel" style="grid-column:1/-1">' +
        '<span class="halo bad">' + ICON.bad + '</span>' +
        '<h3>' + esc(state.error.text) + '</h3>' +
        '<p>No metrics for the ' + esc(state.range) + ' range.</p>' +
        '<span class="code">' + esc(state.error.code) + ' &middot; ' + esc(state.error.detail) + '</span>' +
        '<button type="button" class="btn primary" data-act="retry"' + (state.loading ? ' disabled' : '') + '>' +
        (state.loading ? 'Retrying' : 'Retry') + '</button></div>';
      return;
    }
    if (!state.services) { el.grid.innerHTML = ''; return; }

    var list = sortedServices();
    if (state.filter !== 'all') {
      list = list.filter(function (s) { return s.status === state.filter; });
    }
    if (!list.length) {
      el.grid.innerHTML = '<div class="panel" style="grid-column:1/-1">' +
        '<span class="halo ok">' + ICON.ok + '</span>' +
        '<h3>' + (state.filter === 'all' ? 'No services' : 'None ' + esc(state.filter)) + '</h3>' +
        (state.filter === 'all' ? '' : '<button type="button" class="btn" data-act="clear-filter">Show all</button>') +
        '</div>';
      return;
    }
    el.grid.innerHTML = list.map(card).join('');
  }

  function renderHeader() {
    var btns = el.ranges.querySelectorAll('button'), i;
    for (i = 0; i < btns.length; i++) {
      btns[i].setAttribute('aria-pressed', String(btns[i].getAttribute('data-range') === state.range));
      btns[i].disabled = state.loading;
    }
    el.refresh.disabled = state.loading;
    el.refresh.classList.toggle('spin', state.loading);
    el.bar.hidden = !state.loading;
    el.pause.setAttribute('aria-pressed', String(state.paused));
    el.pause.title = state.paused ? 'Resume auto-refresh' : 'Pause auto-refresh';
    el.pause.setAttribute('aria-label', el.pause.title);
    el.pause.innerHTML = state.paused
      ? '<svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5-13-7.5Z"/></svg>'
      : '<svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
    el.live.className = 'live' + (state.paused ? ' paused' : '') + (state.error ? ' err' : '');
    tickLabel();
  }

  function render() {
    renderHeader();
    renderSummary();
    renderBanner();
    renderGrid();
    renderDrawer();
  }

  /* ----------------------------------------------------------------- drawer */

  function renderDrawer() {
    if (!state.selected) { el.drawerRoot.innerHTML = ''; return; }
    var s = null;
    (state.services || []).forEach(function (x) { if (x.name === state.selected) s = x; });
    var body, m2;

    if (!s) {
      m2 = { cls: 'unk', label: 'Unknown' };
      body = '<div class="panel"><span class="halo unk">' + ICON.unk + '</span>' +
        '<h3>Not in this range</h3><p>' + esc(state.selected) +
        ' is missing from the latest response.</p></div>';
    } else {
      m2 = meta(s.status);
      var color = C[m2.cls];
      var lat = nums(s.latencyMs), er = nums(s.errorRate);
      var up = typeof s.uptimePct === 'number' ? s.uptimePct : null;
      var stat = function (k, v) {
        return '<span class="stat"><span class="k">' + k + '</span><span class="n">' + v + '</span></span>';
      };
      body =
        '<div class="block"><header><span class="k">Latency</span>' + trendEl(lat) +
        '<span class="rng">' + esc(state.dataRange || state.range) + ' &middot; ' + lat.length + ' pts</span></header>' +
        bigChart(lat, color, 'lat') +
        (lat.length ? '<div class="stats">' +
          stat('Now', fmtLat(lat[lat.length - 1])) +
          stat('Min', fmtLat(Math.min.apply(null, lat))) +
          stat('Avg', fmtLat(avg(lat))) +
          stat('Max', fmtLat(Math.max.apply(null, lat))) + '</div>' : '') +
        '</div>' +

        '<div class="block"><header><span class="k">Errors</span>' + trendEl(er) +
        '<span class="rng">' + er.length + ' pts</span></header>' +
        bigChart(er, color, 'err') +
        (er.length ? '<div class="stats">' +
          stat('Now', fmtErr(er[er.length - 1])) +
          stat('Min', fmtErr(Math.min.apply(null, er))) +
          stat('Avg', fmtErr(avg(er))) +
          stat('Max', fmtErr(Math.max.apply(null, er))) + '</div>' : '') +
        '</div>' +

        '<div class="block"><header><span class="k">Uptime</span></header>' +
        (up === null ? '<span class="nodata">no data</span>' :
          '<div class="uprow"><span class="n">' + up.toFixed(2) + '%</span>' +
          '<span style="flex:1"><meter min="95" max="100" low="99" high="99.9" optimum="100" value="' +
          clamp(up, 95, 100).toFixed(3) + '"></meter>' +
          '<span class="scale"><span>95</span><span>99</span><span>100</span></span></span></div>') +
        '</div>';
    }

    el.drawerRoot.innerHTML =
      '<div class="scrim" data-act="close"></div>' +
      '<aside class="drawer" role="dialog" aria-modal="true" aria-label="' + esc(state.selected) + '">' +
      '<div class="dhead"><span class="dot ' + m2.cls + '"></span><h2>' + esc(state.selected) + '</h2>' +
      '<span class="chip ' + m2.cls + '">' + ICON.tiny[m2.cls] + m2.label + '</span>' +
      '<button type="button" class="icon" data-act="close" aria-label="Close" title="Close" style="margin-left:auto">' +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>' +
      '</button></div>' +
      '<div class="dbody">' + body + '</div></aside>';
  }

  /* ------------------------------------------------------------------ fetch */

  var inflight = false;
  var seq = 0;

  function load() {
    if (inflight) return;            /* dedupe: repeat clicks collapse into one request */
    inflight = true;
    var id = ++seq;
    var range = state.range;
    state.loading = true;
    render();                        /* drawn before the request resolves: indicator is immediate */

    function done() {
      inflight = false;
      if (id !== seq) return;
      state.loading = false;
      state.nextPollAt = Date.now() + POLL_MS;
      render();
    }

    api.getMetrics(range).then(function (res) {
      if (id !== seq) return;
      var services = (res && res.services) || [];
      state.services = services;
      state.errScale = errScaleFor(services);
      state.dataRange = range;
      state.updatedAt = Date.now();
      state.error = null;
    }, function (e) {
      if (id !== seq) return;
      state.error = {
        text: errText(e),
        code: (e && (e.code || e.name)) || 'ERROR',
        detail: (e && e.message) || ''
      };
    }).then(done, done);
  }

  /* ------------------------------------------------------------------- tick */

  function tickLabel() {
    if (state.loading) { el.ago.textContent = 'updating'; return; }
    if (!state.services) { el.ago.textContent = state.error ? 'no data' : '\u2014'; return; }
    el.ago.textContent = (state.paused ? 'paused \u00b7 ' : '') + ago(state.updatedAt);
  }

  function tick() {
    tickLabel();
    var frac = 0;
    if (!state.paused && !state.loading && state.nextPollAt) {
      frac = clamp((state.nextPollAt - Date.now()) / POLL_MS, 0, 1);
    }
    el.ring.setAttribute('stroke-dashoffset', (RING_C * (1 - frac)).toFixed(2));
    if (!state.paused && !document.hidden && !inflight && state.nextPollAt && Date.now() >= state.nextPollAt) {
      load();
    }
  }

  /* ----------------------------------------------------------------- events */

  el.ranges.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-range]');
    if (!b || b.disabled) return;
    state.range = b.getAttribute('data-range');
    load();
  });

  el.refresh.addEventListener('click', function () { load(); });

  el.pause.addEventListener('click', function () {
    state.paused = !state.paused;
    if (!state.paused) state.nextPollAt = Date.now();
    renderHeader();
    tick();
  });

  el.summary.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-filter]');
    if (!b) return;
    var f = b.getAttribute('data-filter');
    state.filter = state.filter === f ? 'all' : f;
    renderSummary();
    renderGrid();
  });

  document.addEventListener('click', function (e) {
    var act = e.target.closest('[data-act]');
    if (act) {
      var a = act.getAttribute('data-act');
      if (a === 'retry') { load(); return; }
      if (a === 'close') { state.selected = null; renderDrawer(); return; }
      if (a === 'clear-filter') { state.filter = 'all'; renderSummary(); renderGrid(); return; }
    }
    var c = e.target.closest('.card[data-svc]');
    if (c) { state.selected = c.getAttribute('data-svc'); renderDrawer(); }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && state.selected) { state.selected = null; renderDrawer(); }
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && !state.paused && !inflight) {
      state.nextPollAt = Date.now();
      tick();
    }
  });

  /* ------------------------------------------------------------------- boot */

  render();
  load();
  setInterval(tick, 500);
})();
</script>
</body>
</html>
