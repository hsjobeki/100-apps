<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Service Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface-raised: #232635;
  --border: #2e3148;
  --text: #e1e4ed;
  --text-secondary: #8b8fa7;
  --green: #34d399;
  --green-dim: rgba(52,211,153,0.12);
  --yellow: #fbbf24;
  --yellow-dim: rgba(251,191,36,0.12);
  --red: #f87171;
  --red-dim: rgba(248,113,113,0.12);
  --blue: #60a5fa;
  --blue-dim: rgba(96,165,250,0.1);
  --radius: 10px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.app { max-width: 1280px; margin: 0 auto; padding: 20px 24px 40px; }

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 20px;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.header-left h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
.live-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--green);
  animation: pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(52,211,153,0.5); }
  50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(52,211,153,0); }
}
.header-right { display: flex; align-items: center; gap: 12px; }
.last-updated { font-size: 12px; color: var(--text-secondary); }
.range-toggle {
  display: flex;
  background: var(--surface);
  border-radius: 8px;
  border: 1px solid var(--border);
  overflow: hidden;
}
.range-btn {
  padding: 6px 14px;
  font-size: 12px;
  font-weight: 600;
  font-family: var(--font);
  background: none;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.15s;
}
.range-btn:hover { color: var(--text); }
.range-btn.active {
  background: var(--blue-dim);
  color: var(--blue);
}

/* Summary strip */
.summary-strip {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.summary-card {
  flex: 1;
  min-width: 140px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--border);
}
.summary-icon {
  width: 40px; height: 40px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.summary-icon.green { background: var(--green-dim); color: var(--green); }
.summary-icon.yellow { background: var(--yellow-dim); color: var(--yellow); }
.summary-icon.red { background: var(--red-dim); color: var(--red); }
.summary-count { font-size: 28px; font-weight: 700; line-height: 1; }
.summary-label { font-size: 12px; color: var(--text-secondary); font-weight: 500; margin-top: 2px; }

/* Service grid */
.service-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 14px;
}
.service-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  transition: border-color 0.2s;
}
.service-card:hover { border-color: #3d4166; }
.service-card.status-down { border-left: 3px solid var(--red); }
.service-card.status-degraded { border-left: 3px solid var(--yellow); }
.service-card.status-healthy { border-left: 3px solid var(--green); }

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.card-name-row { display: flex; align-items: center; gap: 8px; }
.card-name { font-size: 15px; font-weight: 600; }
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.badge-healthy { background: var(--green-dim); color: var(--green); }
.badge-degraded { background: var(--yellow-dim); color: var(--yellow); }
.badge-down { background: var(--red-dim); color: var(--red); }
.badge-dot {
  width: 6px; height: 6px; border-radius: 50%;
}
.badge-healthy .badge-dot { background: var(--green); }
.badge-degraded .badge-dot { background: var(--yellow); }
.badge-down .badge-dot { background: var(--red); }

.uptime-val { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
.uptime-val .num { color: var(--text); }

.card-metrics {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 14px;
}
.metric-box {
  background: var(--surface-raised);
  border-radius: 8px;
  padding: 10px 12px;
}
.metric-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.metric-value { font-size: 18px; font-weight: 700; }
.metric-sub { font-size: 11px; color: var(--text-secondary); margin-top: 1px; }

.chart-section { margin-top: 4px; }
.chart-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.chart-box { }
.chart-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.chart-box canvas { width: 100%; height: 48px; display: block; border-radius: 4px; }

/* Loading / Error */
.loading-overlay {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 20px;
  gap: 14px;
}
.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 14px; color: var(--text-secondary); }

.error-banner {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  background: var(--red-dim);
  border: 1px solid rgba(248,113,113,0.25);
  border-radius: var(--radius);
  margin-bottom: 16px;
  font-size: 13px;
  color: var(--red);
}
.error-banner button {
  margin-left: auto;
  background: rgba(248,113,113,0.15);
  border: 1px solid rgba(248,113,113,0.3);
  color: var(--red);
  padding: 5px 12px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  font-family: var(--font);
  cursor: pointer;
  white-space: nowrap;
}
.error-banner button:hover { background: rgba(248,113,113,0.25); }

/* Down alert */
.alert-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  background: var(--red-dim);
  border: 1px solid rgba(248,113,113,0.2);
  border-radius: var(--radius);
  margin-bottom: 16px;
  font-size: 13px;
  font-weight: 500;
}
.alert-bar svg { flex-shrink: 0; }

@media (max-width: 600px) {
  .app { padding: 14px 12px 32px; }
  .header { flex-direction: column; align-items: flex-start; }
  .service-grid { grid-template-columns: 1fr; }
  .summary-strip { flex-direction: column; }
  .summary-card { min-width: unset; }
  .card-metrics { grid-template-columns: 1fr; }
  .chart-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Loading service data&hellip;</div>
  </div>
</div>
<script>
(function() {
  const app = document.getElementById('app');
  const loadingEl = document.getElementById('loading');

  let currentRange = '24h';
  let services = [];
  let pollTimer = null;
  let errorBannerVisible = false;

  function init() {
    fetchData();
    schedulePoll();
  }

  function schedulePoll() {
    clearInterval(pollTimer);
    pollTimer = setInterval(fetchData, 10000);
  }

  async function fetchData() {
    try {
      const result = await window.api.getMetrics(currentRange);
      services = result.services;
      errorBannerVisible = false;
      render();
    } catch (err) {
      if (services.length === 0) {
        // First load failed
        loadingEl.innerHTML = `
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <div class="loading-text" style="color:var(--red)">Failed to load service data</div>
          <button onclick="location.reload()" style="margin-top:4px;background:var(--red-dim);border:1px solid rgba(248,113,113,0.3);color:var(--red);padding:7px 18px;border-radius:6px;font-size:13px;font-weight:600;font-family:var(--font);cursor:pointer;">Retry</button>
        `;
      } else {
        errorBannerVisible = true;
        render();
      }
    }
  }

  function render() {
    const healthy = services.filter(s => s.status === 'healthy');
    const degraded = services.filter(s => s.status === 'degraded');
    const down = services.filter(s => s.status === 'down');

    // Sort: down first, then degraded, then healthy
    const sorted = [...down, ...degraded, ...healthy];

    const now = new Date();
    const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

    let html = '';

    // Header
    html += `<div class="header">
      <div class="header-left">
        <div class="live-dot" title="Auto-refreshing"></div>
        <h1>Service Health</h1>
      </div>
      <div class="header-right">
        <span class="last-updated">Updated ${timeStr}</span>
        <div class="range-toggle">
          <button class="range-btn ${currentRange === '1h' ? 'active' : ''}" data-range="1h">1H</button>
          <button class="range-btn ${currentRange === '24h' ? 'active' : ''}" data-range="24h">24H</button>
          <button class="range-btn ${currentRange === '7d' ? 'active' : ''}" data-range="7d">7D</button>
        </div>
      </div>
    </div>`;

    // Alert bar for down services
    if (down.length > 0) {
      const names = down.map(s => s.name).join(', ');
      html += `<div class="alert-bar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span style="color:var(--red);font-weight:600;">${down.length} service${down.length > 1 ? 's' : ''} down:</span>
        <span style="color:var(--text)">${names}</span>
      </div>`;
    }

    // Error banner
    if (errorBannerVisible) {
      html += `<div class="error-banner" id="errorBanner">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span>Refresh failed &mdash; showing last known data</span>
        <button id="retryBtn">Retry</button>
      </div>`;
    }

    // Summary strip
    html += `<div class="summary-strip">
      <div class="summary-card">
        <div class="summary-icon green">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div>
          <div class="summary-count" style="color:var(--green)">${healthy.length}</div>
          <div class="summary-label">Healthy</div>
        </div>
      </div>
      <div class="summary-card">
        <div class="summary-icon yellow">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
        <div>
          <div class="summary-count" style="color:var(--yellow)">${degraded.length}</div>
          <div class="summary-label">Degraded</div>
        </div>
      </div>
      <div class="summary-card">
        <div class="summary-icon red">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </div>
        <div>
          <div class="summary-count" style="color:var(--red)">${down.length}</div>
          <div class="summary-label">Down</div>
        </div>
      </div>
    </div>`;

    // Service cards
    html += '<div class="service-grid">';
    for (const svc of sorted) {
      const latArr = svc.latencyMs || [];
      const errArr = svc.errorRate || [];
      const latCurrent = latArr.length > 0 ? latArr[latArr.length - 1] : 0;
      const latAvg = latArr.length > 0 ? Math.round(latArr.reduce((a,b) => a + b, 0) / latArr.length) : 0;
      const latMax = latArr.length > 0 ? Math.round(Math.max(...latArr)) : 0;
      const errCurrent = errArr.length > 0 ? errArr[errArr.length - 1] : 0;
      const errAvg = errArr.length > 0 ? (errArr.reduce((a,b) => a + b, 0) / errArr.length) : 0;
      const uptime = svc.uptimePct != null ? svc.uptimePct : 100;

      const statusClass = svc.status;
      const badgeClass = 'badge-' + svc.status;

      const latColor = svc.status === 'down' ? 'var(--red)' : svc.status === 'degraded' ? 'var(--yellow)' : 'var(--text)';
      const errColor = errCurrent > 5 ? 'var(--red)' : errCurrent > 1 ? 'var(--yellow)' : 'var(--text)';
      const uptimeColor = uptime >= 99.9 ? 'var(--green)' : uptime >= 99 ? 'var(--yellow)' : 'var(--red)';

      html += `<div class="service-card status-${statusClass}" data-svc="${svc.name}">
        <div class="card-header">
          <div class="card-name-row">
            <span class="card-name">${esc(svc.name)}</span>
            <span class="status-badge ${badgeClass}"><span class="badge-dot"></span>${svc.status}</span>
          </div>
          <span class="uptime-val"><span class="num" style="color:${uptimeColor}">${uptime.toFixed(2)}%</span> uptime</span>
        </div>
        <div class="card-metrics">
          <div class="metric-box">
            <div class="metric-label">Latency</div>
            <div class="metric-value" style="color:${latColor}">${formatMs(latCurrent)}</div>
            <div class="metric-sub">avg ${formatMs(latAvg)} &middot; peak ${formatMs(latMax)}</div>
          </div>
          <div class="metric-box">
            <div class="metric-label">Error Rate</div>
            <div class="metric-value" style="color:${errColor}">${errCurrent.toFixed(2)}%</div>
            <div class="metric-sub">avg ${errAvg.toFixed(2)}%</div>
          </div>
        </div>
        <div class="chart-section">
          <div class="chart-row">
            <div class="chart-box">
              <div class="chart-label">Latency</div>
              <canvas data-chart="latency" data-svc-name="${esc(svc.name)}" width="300" height="48"></canvas>
            </div>
            <div class="chart-box">
              <div class="chart-label">Error Rate</div>
              <canvas data-chart="error" data-svc-name="${esc(svc.name)}" width="300" height="48"></canvas>
            </div>
          </div>
        </div>
      </div>`;
    }
    html += '</div>';

    app.innerHTML = html;

    // Bind range buttons
    document.querySelectorAll('.range-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const range = this.getAttribute('data-range');
        if (range !== currentRange) {
          currentRange = range;
          fetchData();
        }
      });
    });

    // Bind retry
    const retryBtn = document.getElementById('retryBtn');
    if (retryBtn) {
      retryBtn.addEventListener('click', function() {
        fetchData();
      });
    }

    // Draw sparklines
    drawAllCharts(sorted);
  }

  function drawAllCharts(sortedServices) {
    for (const svc of sortedServices) {
      const latCanvas = document.querySelector(`canvas[data-chart="latency"][data-svc-name="${CSS.escape(svc.name)}"]`);
      const errCanvas = document.querySelector(`canvas[data-chart="error"][data-svc-name="${CSS.escape(svc.name)}"]`);
      if (latCanvas) drawSparkline(latCanvas, svc.latencyMs || [], svc.status === 'down' ? '#f87171' : svc.status === 'degraded' ? '#fbbf24' : '#60a5fa');
      if (errCanvas) drawSparkline(errCanvas, svc.errorRate || [], '#f87171');
    }
  }

  function drawSparkline(canvas, data, strokeColor) {
    if (!data || data.length === 0) return;
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    const w = rect.width;
    const h = rect.height;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    const pad = 2;
    const plotW = w - pad * 2;
    const plotH = h - pad * 2;

    const min = Math.min(...data);
    const max = Math.max(...data);
    const range = max - min || 1;

    // Fill gradient
    ctx.beginPath();
    for (let i = 0; i < data.length; i++) {
      const x = pad + (i / (data.length - 1)) * plotW;
      const y = pad + plotH - ((data[i] - min) / range) * plotH;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    // Close for fill
    ctx.lineTo(pad + plotW, pad + plotH);
    ctx.lineTo(pad, pad + plotH);
    ctx.closePath();
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, strokeColor + '20');
    grad.addColorStop(1, strokeColor + '02');
    ctx.fillStyle = grad;
    ctx.fill();

    // Stroke line
    ctx.beginPath();
    for (let i = 0; i < data.length; i++) {
      const x = pad + (i / (data.length - 1)) * plotW;
      const y = pad + plotH - ((data[i] - min) / range) * plotH;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = 1.5;
    ctx.lineJoin = 'round';
    ctx.stroke();

    // Last point dot
    const lastX = pad + plotW;
    const lastY = pad + plotH - ((data[data.length - 1] - min) / range) * plotH;
    ctx.beginPath();
    ctx.arc(lastX, lastY, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = strokeColor;
    ctx.fill();
  }

  function formatMs(ms) {
    if (ms >= 1000) return (ms / 1000).toFixed(1) + 's';
    return Math.round(ms) + 'ms';
  }

  function esc(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  init();
})();
</script>
</body>
</html>
