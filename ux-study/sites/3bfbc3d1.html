<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job queue — admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080b10;
  --panel:#0f151e;
  --panel-2:#131b26;
  --line:#1f2a38;
  --line-soft:#18212d;
  --txt:#e8eef7;
  --mut:#8ba0ba;
  --mut-2:#61748c;
  --acc:#4da3ff;
  --queued:#8595ad;
  --running:#38bdf8;
  --ok:#34d399;
  --fail:#fb7185;
  --warn:#fbbf24;
  --radius:12px;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1100px 500px at 78% -12%, rgba(77,163,255,.09), transparent 60%),
    radial-gradient(760px 420px at 4% 0%, rgba(251,113,133,.07), transparent 62%),
    var(--bg);
  color:var(--txt);
  font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2{margin:0;font-weight:650;letter-spacing:-.01em}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:.86em;letter-spacing:-.02em}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  padding:14px 22px;
  background:rgba(8,11,16,.82);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.mark{
  width:38px;height:38px;border-radius:10px;flex:none;
  display:grid;place-items:center;
  background:linear-gradient(160deg,#16314e,#0d1a29);
  border:1px solid #23415f;color:var(--acc);
}
.mark .ic{width:20px;height:20px}
.brand h1{font-size:16px}
.meta{display:flex;align-items:center;gap:7px;color:var(--mut-2);font-size:12.5px;margin-top:2px}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(52,211,153,.55);animation:pulse 2.4s infinite}
.pulse.syncing{background:var(--acc);animation-duration:.9s}
.pulse.paused{background:var(--mut-2);animation:none;box-shadow:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}70%{box-shadow:0 0 0 6px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.tools{display:flex;align-items:center;gap:8px}

.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 13px;border-radius:9px;
  border:1px solid var(--line);background:var(--panel-2);
  cursor:pointer;font-size:13.5px;font-weight:550;
  transition:background .12s,border-color .12s,transform .06s,opacity .12s;
  white-space:nowrap;
}
.btn:hover:not(:disabled){background:#1a2432;border-color:#2c3c50}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,#2d3f57,#1d2b3d);border-color:#3c5a7d;color:#eaf4ff}
.btn.primary:hover:not(:disabled){background:linear-gradient(180deg,#364b67,#22334a)}
.btn.danger{border-color:#5b2a38;background:#2a1720;color:#ffd8de}
.btn.danger:hover:not(:disabled){background:#361c26;border-color:#7a3a4b}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px;gap:5px}
.btn.link{background:none;border:none;padding:0;color:var(--acc);text-decoration:underline;font-size:12.5px}
.count-pill{
  min-width:20px;padding:1px 6px;border-radius:20px;
  background:rgba(251,113,133,.16);color:var(--fail);
  font-family:var(--mono);font-size:11.5px;font-weight:600;
}
.btn:disabled .count-pill{background:rgba(255,255,255,.08);color:var(--mut)}
.spin{animation:spin .85s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- layout ---------- */
main{max-width:1320px;margin:0 auto;padding:20px 22px 64px}
.overview{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.tile{
  text-align:left;padding:13px 14px;border-radius:var(--radius);
  border:1px solid var(--line-soft);background:var(--panel);
  cursor:pointer;display:block;transition:border-color .12s,background .12s;
}
.tile:hover{border-color:#2c3c50;background:var(--panel-2)}
.tile:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tile[aria-pressed="true"]{border-color:#3c5a7d;background:var(--panel-2);box-shadow:inset 0 0 0 1px rgba(77,163,255,.18)}
.tile .t-head{display:flex;align-items:center;gap:7px;color:var(--mut);font-size:12.5px;font-weight:550}
.tile .t-num{font-size:30px;font-weight:660;letter-spacing:-.02em;line-height:1.1;margin:4px 0 8px;font-variant-numeric:tabular-nums}
.tile .share{height:4px;border-radius:3px;background:#1b2635;overflow:hidden}
.tile .share i{display:block;height:100%;border-radius:3px;transition:width .5s ease}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--mut)}
.s-failed .dot{background:var(--fail)}
.s-running .dot{background:var(--running)}
.s-queued .dot{background:var(--queued)}
.s-succeeded .dot{background:var(--ok)}
.seg-failed{fill:#fb7185}
.seg-running{fill:#38bdf8}
.seg-queued{fill:#8595ad}
.seg-succeeded{fill:#34d399}
.tile.s-failed .share i{background:var(--fail)}
.tile.s-running .share i{background:var(--running)}
.tile.s-queued .share i{background:var(--queued)}
.tile.s-succeeded .share i{background:var(--ok)}
.tile.s-failed.hot{border-color:#5b2a38;background:linear-gradient(180deg,rgba(251,113,133,.09),transparent 70%),var(--panel)}
.tile.s-failed.hot .t-num{color:#ffd8de}

.mixwrap{display:flex;align-items:center;gap:12px;padding:0 2px 14px}
.mix{flex:1;height:8px;width:100%;display:block}
.mix-total{color:var(--mut-2);font-size:12px;white-space:nowrap}

/* ---------- controls ---------- */
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;background:var(--panel);padding:4px;border-radius:10px;border:1px solid var(--line-soft)}
.chip-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 11px;border-radius:7px;border:1px solid transparent;background:none;
  cursor:pointer;color:var(--mut);font-size:13px;font-weight:550;
}
.chip-btn:hover{color:var(--txt);background:var(--panel-2)}
.chip-btn[aria-pressed="true"]{background:var(--panel-2);border-color:var(--line);color:var(--txt)}
.chip-btn .n{font-family:var(--mono);font-size:11.5px;color:var(--mut-2)}
.chip-btn[aria-pressed="true"] .n{color:var(--mut)}
.search{position:relative;margin-left:auto}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mut-2)}
.search input{
  width:210px;padding:8px 10px 8px 32px;border-radius:9px;
  background:var(--panel);border:1px solid var(--line-soft);color:var(--txt);
  font:inherit;font-size:13.5px;font-family:var(--mono);
}
.search input::placeholder{color:var(--mut-2);font-family:Inter,sans-serif}
.search input:focus{outline:none;border-color:#3c5a7d;background:var(--panel-2)}

.selbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:9px 12px;margin-bottom:10px;border-radius:10px;
  background:linear-gradient(180deg,rgba(77,163,255,.1),transparent),var(--panel-2);
  border:1px solid #2c3c50;
}
.selbar .n{font-size:13.5px;font-weight:600}
.selbar .grow{margin-left:auto}

.bulkbar{
  display:flex;align-items:center;gap:12px;
  padding:9px 12px;margin-bottom:10px;border-radius:10px;
  background:var(--panel-2);border:1px solid var(--line);
}
.bulkbar .bar{flex:1;max-width:340px}
.bulkbar .label{font-size:13px;color:var(--mut)}

/* ---------- banner ---------- */
.banner{
  display:flex;align-items:center;gap:10px;
  padding:11px 13px;margin-bottom:10px;border-radius:10px;
  border:1px solid #5b2a38;background:#1d1219;color:#ffd8de;font-size:13.5px;
}
.banner .ic{color:var(--fail);flex:none}
.banner .grow{margin-left:auto}

/* ---------- table ---------- */
.tablewrap{border:1px solid var(--line-soft);border-radius:var(--radius);background:var(--panel);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{
  text-align:left;padding:9px 14px;font-size:11.5px;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;color:var(--mut-2);
  background:var(--panel-2);border-bottom:1px solid var(--line);white-space:nowrap;
}
tbody tr.row{border-bottom:1px solid var(--line-soft);transition:background .1s}
tbody tr.row:last-child{border-bottom:none}
tbody tr.row:hover{background:var(--panel-2)}
tbody tr.row.is-failed{box-shadow:inset 3px 0 0 var(--fail)}
tbody tr.row.is-running{box-shadow:inset 3px 0 0 var(--running)}
tbody tr.row.busy{background:rgba(77,163,255,.05)}
td{padding:11px 14px;vertical-align:middle}
.c-sel{width:34px;padding-right:0}
.c-id{width:150px}
.c-status{width:132px}
.c-prog{width:190px}
.c-act{width:190px}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--acc);cursor:pointer;margin:0}
.idbtn{
  background:none;border:none;padding:0;cursor:pointer;
  font-family:var(--mono);font-size:13px;color:var(--txt);
  border-bottom:1px dashed #33465e;
}
.idbtn:hover{color:var(--acc);border-bottom-color:var(--acc)}
.idbtn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.chip{display:inline-flex;align-items:center;gap:7px;padding:3px 9px 3px 7px;border-radius:20px;font-size:12.5px;font-weight:550;border:1px solid var(--line);background:var(--panel-2)}
.chip.s-failed{color:#ffc2cc;border-color:#5b2a38;background:#25141b}
.chip.s-running{color:#bfe6ff;border-color:#20475f;background:#0f1f2b}
.chip.s-queued{color:#c3cede;border-color:#2b3849;background:#151d28}
.chip.s-succeeded{color:#b6f0da;border-color:#20513f;background:#0f2019}
.chip.s-running .dot{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

.progcell{display:flex;align-items:center;gap:9px}
.bar{position:relative;flex:1;height:6px;border-radius:4px;background:#1b2635;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--queued);transition:width .45s ease}
.bar.s-running i{background:linear-gradient(90deg,#2b8ec7,var(--running))}
.bar.s-succeeded i{background:var(--ok)}
.bar.s-failed i{background:var(--fail)}
.bar.s-running::after{
  content:"";position:absolute;inset:0;border-radius:4px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);
  animation:sheen 1.6s linear infinite;
}
@keyframes sheen{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.pct{width:34px;text-align:right;color:var(--mut);font-variant-numeric:tabular-nums;font-size:12px}

.note{display:flex;align-items:center;gap:7px;font-size:13px;min-width:0}
.note.err{color:#ffc2cc}
.note.err .ic{color:var(--fail)}
.note .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note.ok{color:var(--mut)}
.note a{color:var(--acc);text-decoration:none;display:inline-flex;align-items:center;gap:5px;flex:none}
.note a:hover{text-decoration:underline}
.dash{color:#3a4b61}

.acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rowerr{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:#ffc2cc}
.rowerr .ic{width:13px;height:13px;color:var(--fail);flex:none}

.pad{padding:30px 16px;text-align:center;color:var(--mut)}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ic{width:34px;height:34px;color:#334761;stroke-width:1.3}
.empty .hd{font-size:15px;font-weight:600;color:var(--txt)}
.sk{height:13px;border-radius:5px;background:linear-gradient(90deg,#161f2b,#1e2a39,#161f2b);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(4,7,11,.6);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;height:100%;width:min(430px,100%);z-index:50;
  background:var(--panel);border-left:1px solid var(--line);
  transform:translateX(100%);visibility:hidden;
  transition:transform .22s ease,visibility .22s ease;
  display:flex;flex-direction:column;
}
.drawer.on{transform:none;visibility:visible;box-shadow:-24px 0 60px rgba(0,0,0,.45)}
.dr-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dr-head h2{font-size:14px;font-family:var(--mono);font-weight:500}
.dr-head .grow{margin-left:auto}
.iconbtn{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;color:var(--mut)}
.iconbtn:hover{color:var(--txt);border-color:#2c3c50}
.dr-body{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.ring{display:flex;align-items:center;gap:16px}
.ring svg{width:92px;height:92px;flex:none;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:#1b2635;stroke-width:8}
.ring .val{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring .lbl{font-size:26px;font-weight:660;font-variant-numeric:tabular-nums}
.ring .sub{margin-top:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13.5px;margin:0}
.kv dt{color:var(--mut-2)}
.kv dd{margin:0;text-align:right;font-family:var(--mono);font-size:12.5px}
.block{border-radius:10px;padding:12px;border:1px solid var(--line-soft);background:var(--panel-2);font-size:13.5px}
.block.err{border-color:#5b2a38;background:#1d1219;color:#ffc2cc}
.block .hd{display:flex;align-items:center;gap:7px;font-weight:600;font-size:12.5px;margin-bottom:6px}
.block.err .hd{color:#ff9fae}
.block .msg{font-family:var(--mono);font-size:12.5px;line-height:1.5;word-break:break-word}
.dr-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding:14px 16px;border-top:1px solid var(--line)}
.dr-acts:empty{display:none}

/* ---------- dialog ---------- */
dialog{
  border:1px solid var(--line);background:var(--panel);color:var(--txt);
  border-radius:14px;padding:0;width:min(420px,calc(100% - 32px));
  box-shadow:0 30px 80px rgba(0,0,0,.6);
}
dialog::backdrop{background:rgba(4,7,11,.62)}
.dg-body{padding:18px 18px 14px}
.dg-body h2{font-size:16px;display:flex;align-items:center;gap:9px}
.dg-body h2 .ic{color:var(--warn);width:18px;height:18px}
.dg-note{color:var(--mut);font-size:13.5px;margin:9px 0 0}
.dg-ids{margin-top:10px;max-height:120px;overflow:auto;font-family:var(--mono);font-size:12px;color:var(--mut);background:var(--panel-2);border:1px solid var(--line-soft);border-radius:8px;padding:8px 10px;word-break:break-all}
.dg-acts{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--panel-2);border-radius:0 0 14px 14px}

/* ---------- toasts ---------- */
.toasts{position:fixed;right:18px;bottom:18px;z-index:70;display:flex;flex-direction:column;gap:9px;width:min(370px,calc(100% - 36px))}
.toast{
  display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-radius:11px;
  border:1px solid var(--line);background:#121a25;box-shadow:0 14px 34px rgba(0,0,0,.44);
  font-size:13.5px;animation:rise .18s ease;
}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.toast.err{border-color:#5b2a38;background:#1d1219}
.toast.err .ic{color:var(--fail)}
.toast.ok .ic{color:var(--ok)}
.toast .ic{margin-top:2px}
.toast .body{flex:1;min-width:0}
.toast .acts{margin-top:7px}
.toast .x{margin-left:4px;background:none;border:none;color:var(--mut-2);cursor:pointer;padding:0;line-height:1}
.toast .x:hover{color:var(--txt)}

@media (max-width:1000px){
  .overview{grid-template-columns:repeat(2,1fr)}
  .c-prog{width:150px}
  .c-act{width:auto}
}
@media (max-width:820px){
  main{padding:16px 14px 60px}
  .topbar{padding:12px 14px}
  .search{margin-left:0;width:100%}
  .search input{width:100%}
  thead{display:none}
  table,tbody,tr,td{display:block}
  tbody tr.row{
    display:grid;gap:8px;padding:12px;
    grid-template-columns:auto 1fr auto;
    grid-template-areas:"sel id status" "prog prog prog" "note note note" "act act act";
    border-bottom:1px solid var(--line);
  }
  td{padding:0}
  .c-sel{grid-area:sel;width:auto}
  .c-id{grid-area:id;width:auto}
  .c-status{grid-area:status;width:auto;justify-self:end}
  .c-prog{grid-area:prog;width:auto}
  .c-note{grid-area:note}
  .c-act{grid-area:act;width:auto}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;transition-duration:.001s!important}
}
</style>
</head>
<body>

<svg class="sr" aria-hidden="true" focusable="false">
  <symbol id="i-stack" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5zM3 12l9 5 9-5M3 16.5l9 5 9-5"/></symbol>
  <symbol id="i-retry" viewBox="0 0 24 24"><path d="M20.5 11.7A8.5 8.5 0 1 1 18 5.6M20.5 3.5v4.2h-4.2"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M8.6 8.6l6.8 6.8"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6M20.5 3v4.2h-4.2"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3.5v10.5m0 0l4-4m-4 4l-4-4M4.5 19.5h15"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4.2l8.8 15.6H3.2L12 4.2zM12 10v4.2M12 17.4v.01"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.6l4.8 4.8L19.5 7.2"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9.5 5v14M14.5 5v14"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7.5 4.5l12 7.5-12 7.5z"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3.5 13.5h4l2 3h5l2-3h4M3.5 13.5l2.6-9h11.8l2.6 9v4.6a2 2 0 0 1-2 2H5.5a2 2 0 0 1-2-2v-4.6z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.6"/><path d="M16 16l4.5 4.5"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.2V12l3.2 2"/></symbol>
</svg>

<header class="topbar">
  <div class="brand">
    <div class="mark"><svg class="ic"><use href="#i-stack"/></svg></div>
    <div>
      <h1>Job queue</h1>
      <div class="meta">
        <span class="pulse" id="pulse"></span>
        <span id="liveLabel">Live</span>
        <span aria-hidden="true">·</span>
        <span id="stamp">connecting</span>
      </div>
    </div>
  </div>
  <div class="tools">
    <button class="btn primary" id="retryAll" type="button" disabled>
      <svg class="ic" aria-hidden="true"><use href="#i-retry"/></svg><span id="retryAllT">Retry failed</span><span class="count-pill" id="retryAllN">0</span>
    </button>
    <button class="btn" id="liveBtn" type="button">
      <svg class="ic" aria-hidden="true"><use href="#i-pause"/></svg><span id="liveBtnT">Pause</span>
    </button>
    <button class="btn" id="refreshBtn" type="button">
      <svg class="ic" id="refreshIcon" aria-hidden="true"><use href="#i-refresh"/></svg>Refresh
    </button>
  </div>
</header>

<main>
  <section class="overview" aria-label="Queue summary">
    <button class="tile s-failed" type="button" data-status="failed" aria-pressed="false">

      <div class="t-num" id="n-running">—</div>
      <div class="share" aria-hidden="true"><i id="sh-running" style="width:0%"></i></div>
    </button>
    <button class="tile s-queued" type="button" data-status="queued" aria-pressed="false">
      <span class="t-head"><span class="dot"></span>Queued</span>
      <div class="t-num" id="n-queued">—</div>
      <div class="share" aria-hidden="true"><i id="sh-queued" style="width:0%"></i></div>
    </button>
    <button class="tile s-succeeded" type="button" data-status="succeeded" aria-pressed="false">
      <span class="t-head"><span class="dot"></span>Succeeded</span>
      <div class="t-num" id="n-succeeded">—</div>
      <div class="share" aria-hidden="true"><i id="sh-succeeded" style="width:0%"></i></div>
    </button>
  </section>

  <div class="mixwrap">
    <svg class="mix" viewBox="0 0 400 8" preserveAspectRatio="none" role="img" aria-label="Queue composition by status">
      <defs><clipPath id="mixClip"><rect x="0" y="0" width="400" height="8" rx="4"/></clipPath></defs>
      <g clip-path="url(#mixClip)">
        <rect x="0" y="0" width="400" height="8" fill="#1b2635"/>
        <rect class="seg-failed" id="seg-failed" x="0" y="0" width="0" height="8"/>
        <rect class="seg-running" id="seg-running" x="0" y="0" width="0" height="8"/>
        <rect class="seg-queued" id="seg-queued" x="0" y="0" width="0" height="8"/>
        <rect class="seg-succeeded" id="seg-succeeded" x="0" y="0" width="0" height="8"/>

  <div id="banner" hidden></div>
  <div id="bulk" hidden></div>
  <div id="selbar" hidden></div>

  <div class="controls">
    <div class="chips" role="group" aria-label="Filter by status">
      <button class="chip-btn" type="button" data-filter="all" aria-pressed="true">All<span class="n" id="f-all">0</span></button>
      <button class="chip-btn" type="button" data-filter="failed" aria-pressed="false">Failed<span class="n" id="f-failed">0</span></button>
      <button class="chip-btn" type="button" data-filter="running" aria-pressed="false">Running<span class="n" id="f-running">0</span></button>
      <button class="chip-btn" type="button" data-filter="queued" aria-pressed="false">Queued<span class="n" id="f-queued">0</span></button>
      <button class="chip-btn" type="button" data-filter="succeeded" aria-pressed="false">Succeeded<span class="n" id="f-succeeded">0</span></button>
    </div>
    <div class="search">
      <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="q" type="search" placeholder="Find job ID" aria-label="Find job ID" autocomplete="off">
    </div>
  </div>

  <div class="tablewrap">
    <table>
      <thead>
        <tr>
          <th class="c-sel"><input type="checkbox" id="selAll" aria-label="Select all shown jobs"></th>
          <th class="c-id">Job</th>
          <th class="c-status">Status</th>
          <th class="c-prog">Progress</th>
          <th>Detail</th>
          <th class="c-act">Actions</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-labelledby="drTitle" aria-hidden="true">
  <div class="dr-head">
    <h2 id="drTitle">Job detail</h2>
    <span class="grow"></span>
    <button class="iconbtn" id="drClose" type="button" aria-label="Close detail"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
  </div>
  <div class="dr-body" id="drBody"></div>
  <div class="dr-acts" id="drActs"></div>
</aside>

<dialog id="confirm" aria-labelledby="cfTitle">
  <div class="dg-body">
    <h2 id="cfTitle"><svg class="ic" aria-hidden="true"><use href="#i-alert"/></svg><span id="cfText">Cancel job?</span></h2>
    <p class="dg-note">The job stops and is marked failed. Retry puts it back in the queue.</p>
    <div class="dg-ids" id="cfIds"></div>
  </div>
  <div class="dg-acts">
    <button class="btn" id="cfNo" type="button">Keep job</button>
    <button class="btn danger" id="cfYes" type="button"><svg class="ic" aria-hidden="true"><use href="#i-stop"/></svg>Cancel job</button>
  </div>
</dialog>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
var api = window.api;
var $ = function(s,r){ return (r||document).querySelector(s); };
var all = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };
var ORDER = { failed:0, running:1, queued:2, succeeded:3 };
var STATUSES = ["failed","running","queued","succeeded"];
var POLL_MS = 2000;

var state = {
  jobs: null,          // last confirmed server snapshot; null until first load
  listError: null,
  filter: "all",
  query: "",
  selected: new Set(),
  pending: new Map(),  // id -> "retry" | "cancel"
  rowError: new Map(), // id -> message
  live: true,
  syncing: false,
  lastSync: 0,
  drawerId: null,
  drawerJob: null,
  bulk: null           // { kind, total, done }
};

/* ---------------- helpers ---------------- */
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c];
  });
}
function icon(name, extra){ return '<svg class="ic' + (extra ? " " + extra : "") + '" aria-hidden="true"><use href="#i-' + name + '"/></svg>'; }
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function describe(e, what){
  if (!e) return "Unknown error.";
  if (e.code === "NETWORK") return "Network error — " + what + " never reached the server.";
  if (e.code === "NOT_FOUND") return "This job is no longer in the queue.";
  if (e.name === "AbortError") return "Request was cancelled.";
  return e.message ? String(e.message) : "Unexpected error.";
}
function counts(jobs){
  var c = { failed:0, running:0, queued:0, succeeded:0, total:0 };
  (jobs || []).forEach(function(j){ if (c[j.status] !== undefined) c[j.status]++; c.total++; });
  return c;
}
function idsWith(pred){ return (state.jobs || []).filter(pred).map(function(j){ return j.id; }); }
function jobById(id){
  var list = state.jobs || [], i;
  for (i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
  return null;
}
function isFailed(id){ var j = jobById(id); return !!j && j.status === "failed"; }
function isLive(id){ var j = jobById(id); return !!j && (j.status === "running" || j.status === "queued"); }

/* ---------------- server sync ---------------- */
var pollTimer = null;

function schedule(){
  clearTimeout(pollTimer);
  if (state.live) pollTimer = setTimeout(function(){ sync(); }, POLL_MS);
}

function sync(){
  if (state.syncing) return Promise.resolve();   // one refresh in flight at a time
  state.syncing = true;
  render();
  return Promise.resolve()
    .then(function(){ return api.listJobs(); })
    .then(function(jobs){
      state.jobs = jobs.slice();
      state.listError = null;
      state.lastSync = Date.now();
      if (state.drawerId){
        var j = jobById(state.drawerId);
        if (j) state.drawerJob = j;
      }
    })
    .catch(function(e){
      state.listError = describe(e, "the queue refresh");
    })
    .then(function(){
      state.syncing = false;
      render();
      schedule();
    });
}

/* ---------------- actions ---------------- */
function runOne(id, kind){
  if (state.pending.has(id)) return Promise.resolve(false);   // de-duplicate in-flight action
  state.pending.set(id, kind);
  state.rowError.delete(id);
  render();
  var call = kind === "retry" ? api.retryJob(id) : api.cancelJob(id);
  return call.then(function(job){
    // Only the server's own snapshot changes what is displayed.
    var list = state.jobs || [], i, found = false;
    for (i = 0; i < list.length; i++) if (list[i].id === job.id){ list[i] = job; found = true; }
    if (!found) list.push(job);
    if (state.drawerId === job.id) state.drawerJob = job;
    return true;
  }).catch(function(e){
    state.rowError.set(id, describe(e, kind === "retry" ? "the retry" : "the cancel"));
    return false;
  }).then(function(ok){
    state.pending.delete(id);
    render();
    return ok;
  });
}

function runBulk(kind, ids){
  if (state.bulk || !ids.length) return;
  var queue = ids.slice(), failed = [];
  state.bulk = { kind: kind, total: ids.length, done: 0 };
  render();
  function lane(){
    if (!queue.length) return Promise.resolve();
    var id = queue.shift();
    return runOne(id, kind).then(function(ok){
      if (!ok) failed.push(id);
      state.bulk.done++;
      render();
      return lane();
    });
  }
  var lanes = [], i;
  for (i = 0; i < Math.min(3, ids.length); i++) lanes.push(lane());
  Promise.all(lanes).then(function(){
    state.bulk = null;
    state.selected.clear();
    render();
    var verb = kind === "retry" ? "requeued" : "cancelled";
    if (!failed.length){
      toast("ok", ids.length + (ids.length === 1 ? " job " : " jobs ") + verb + ".");
    } else {
      var why = state.rowError.get(failed[0]) || "The server rejected the request.";
      toast("err", failed.length + " of " + ids.length + " failed. " + why, {
        label: "Retry " + failed.length,
        run: function(){ runBulk(kind, failed); }
      });
    }
  });
}

/* ---------------- confirm dialog ---------------- */
var dlg = $("#confirm"), pendingCancel = [];

function askCancel(ids){
  if (!ids.length) return;
  pendingCancel = ids.slice();
  $("#cfText").textContent = ids.length > 1 ? "Cancel " + ids.length + " jobs?" : "Cancel job?";
  $("#cfYes").innerHTML = icon("stop") + (ids.length > 1 ? "Cancel " + ids.length : "Cancel job");
  $("#cfIds").textContent = ids.join("   ");
  if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
}
function closeDialog(){
  pendingCancel = [];
  if (typeof dlg.close === "function" && dlg.open) dlg.close();
  else dlg.removeAttribute("open");
}
$("#cfNo").addEventListener("click", closeDialog);
dlg.addEventListener("close", function(){ pendingCancel = []; });
$("#cfYes").addEventListener("click", function(){
  var ids = pendingCancel.slice();
  closeDialog();
  if (ids.length === 1) runOne(ids[0], "cancel");
  else if (ids.length > 1) runBulk("cancel", ids);
});

/* ---------------- toasts ---------------- */
function toast(kind, message, action){
  var t = document.createElement("div");
  t.className = "toast " + (kind === "err" ? "err" : "ok");
  t.innerHTML =
    icon(kind === "err" ? "alert" : "check") +
    '<div class="body"><div class="msg">' + esc(message) + "</div></div>" +
    '<button class="x" type="button" aria-label="Dismiss">' + icon("x") + "</button>";
  if (action){
    var wrap = document.createElement("div");
    wrap.className = "acts";
    var b = document.createElement("button");
    b.type = "button";
    b.className = "btn link";
    b.textContent = action.label;
    b.addEventListener("click", function(){ t.remove(); action.run(); });
    wrap.appendChild(b);
    t.querySelector(".body").appendChild(wrap);
  }
  t.querySelector(".x").addEventListener("click", function(){ t.remove(); });
  $("#toasts").appendChild(t);
  if (kind !== "err") setTimeout(function(){ t.remove(); }, 4500);
}

/* ---------------- drawer ---------------- */
function openDrawer(id){
  state.drawerId = id;
  state.drawerJob = jobById(id);
  $("#drawer").classList.add("on");
  $("#drawer").setAttribute("aria-hidden", "false");
  $("#scrim").classList.add("on");
  render();
  api.getJob(id).then(function(job){
    if (state.drawerId !== id) return;              // closed or switched mid-request
    state.drawerJob = job;
    render();
  }).catch(function(e){
    if (state.drawerId !== id) return;
    state.rowError.set(id, describe(e, "the detail load"));
    render();
  });
  setTimeout(function(){ if (state.drawerId === id) $("#drClose").focus(); }, 60);
}
function closeDrawer(){
  if (!state.drawerId) return;
  var d = $("#drawer");
  if (document.activeElement && d.contains(document.activeElement)) document.activeElement.blur();
  state.drawerId = null;
  state.drawerJob = null;
  d.classList.remove("on");
  d.setAttribute("aria-hidden", "true");
  $("#scrim").classList.remove("on");
  $("#drBody").innerHTML = "";
  $("#drActs").innerHTML = "";
}
$("#drClose").addEventListener("click", closeDrawer);
$("#scrim").addEventListener("click", closeDrawer);
document.addEventListener("keydown", function(e){
  if (e.key === "Escape" && state.drawerId) closeDrawer();
});

/* ---------------- rows ---------------- */
var rowEls = new Map();

function createRow(id){
  var tr = document.createElement("tr");
  tr.className = "row";
  tr.dataset.id = id;
  tr.innerHTML =
    '<td class="c-sel"><input type="checkbox" class="chk" aria-label="Select ' + esc(id) + '"></td>' +
    '<td class="c-id"><button class="idbtn" type="button">' + esc(id) + "</button></td>" +
    '<td class="c-status"><span class="chip"><span class="dot"></span><span class="chip-t"></span></span></td>' +
    '<td class="c-prog"><div class="progcell">' +
      '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Progress of ' + esc(id) + '"><i style="width:0%"></i></div>' +
      '<span class="pct">0%</span>' +
    "</div></td>" +
    '<td class="c-note"></td>' +
    '<td class="c-act"><div class="acts"></div><div class="rowerr" hidden></div></td>';

  var refs = {
    tr: tr,
    chk: tr.querySelector(".chk"),
    chip: tr.querySelector(".chip"),
    chipT: tr.querySelector(".chip-t"),
    bar: tr.querySelector(".bar"),
    fill: tr.querySelector(".bar i"),
    pct: tr.querySelector(".pct"),
    note: tr.querySelector(".c-note"),
    acts: tr.querySelector(".acts"),
    err: tr.querySelector(".rowerr"),
    sig: ""
  };
  refs.chk.addEventListener("change", function(){
    if (refs.chk.checked) state.selected.add(id); else state.selected.delete(id);
    render();
  });
  tr.querySelector(".idbtn").addEventListener("click", function(){ openDrawer(id); });
  function act(ev){
    var b = ev.target.closest("button[data-act]");
    if (!b) return;
    if (b.dataset.act === "retry") runOne(id, "retry");
    else askCancel([id]);
  }
  refs.acts.addEventListener("click", act);
  refs.err.addEventListener("click", act);
  rowEls.set(id, refs);
  return refs;
}

function actionsHTML(job, pending){
  if (job.status === "failed"){
    return '<button class="btn sm" type="button" data-act="retry"' + (pending ? " disabled" : "") + ">" +
      icon("retry", pending === "retry" ? "spin" : "") + (pending === "retry" ? "Retrying" : "Retry") + "</button>";
  }
  if (job.status === "running" || job.status === "queued"){
    return '<button class="btn sm" type="button" data-act="cancel"' + (pending ? " disabled" : "") + ">" +
      icon("stop", pending === "cancel" ? "spin" : "") + (pending === "cancel" ? "Cancelling" : "Cancel") + "</button>";
  }
  return '<span class="dash" aria-hidden="true">—</span>';
}

function noteHTML(job){
  if (job.status === "failed" && job.error){
    return '<div class="note err" title="' + esc(job.error) + '">' + icon("alert") +
      '<span class="t">' + esc(job.error) + "</span></div>";
  }
  if (job.status === "succeeded" && job.result){
    var rows = typeof job.result.rows === "number" ? job.result.rows.toLocaleString() : job.result.rows;
    return '<div class="note ok"><span class="t">' + esc(rows) + " rows</span>" +
      (job.result.downloadUrl ? '<a href="' + esc(job.result.downloadUrl) + '" download>' + icon("download") + "Download</a>" : "") +
      "</div>";
  }
  if (job.status === "running") return '<div class="note ok">' + icon("clock") + '<span class="t">Processing</span></div>';
  if (job.status === "queued") return '<div class="note ok">' + icon("clock") + '<span class="t">Waiting for a worker</span></div>';
  return '<span class="dash" aria-hidden="true">—</span>';
}

function updateRow(refs, job){
  var pending = state.pending.get(job.id) || null;
  var rowErr = state.rowError.get(job.id) || null;
  var pct = Math.max(0, Math.min(100, Math.round(job.progress || 0)));

  refs.tr.className = "row is-" + job.status + (pending ? " busy" : "");
  var want = state.selected.has(job.id);
  if (refs.chk.checked !== want) refs.chk.checked = want;

  refs.chip.className = "chip s-" + job.status;
  if (refs.chipT.textContent !== cap(job.status)) refs.chipT.textContent = cap(job.status);

  refs.bar.className = "bar s-" + job.status;
  refs.bar.setAttribute("aria-valuenow", String(pct));
  refs.fill.style.width = pct + "%";
  if (refs.pct.textContent !== pct + "%") refs.pct.textContent = pct + "%";

  var sig = [job.status, job.error || "", job.result ? job.result.rows : "", pending, rowErr].join("|");
  if (refs.sig !== sig){
    refs.sig = sig;
    refs.note.innerHTML = noteHTML(job);
    refs.acts.innerHTML = actionsHTML(job, pending);
    if (rowErr){
      refs.err.hidden = false;
      refs.err.innerHTML = icon("alert") + "<span>" + esc(rowErr) + "</span>" +
        '<button class="btn link" type="button" data-act="' + (job.status === "failed" ? "retry" : "cancel") + '">Try again</button>';
    } else {
      refs.err.hidden = true;
      refs.err.innerHTML = "";
    }
  }
}

function skeletonHTML(){
  var html = "", i;
  for (i = 0; i < 6; i++){
    html +=
      '<tr class="row"><td class="c-sel"></td>' +
      '<td class="c-id"><div class="sk" style="width:104px"></div></td>' +
      '<td class="c-status"><div class="sk" style="width:82px;height:20px;border-radius:20px"></div></td>' +
      '<td class="c-prog"><div class="sk" style="width:100%;height:6px"></div></td>' +
      '<td><div class="sk" style="width:' + (120 + i * 22) + 'px"></div></td>' +
      '<td class="c-act"><div class="sk" style="width:74px;height:26px;border-radius:8px"></div></td></tr>';
  }
  return html;
}

/* ---------------- render ---------------- */
function visibleJobs(){
  var q = state.query.trim().toLowerCase();
  return (state.jobs || [])
    .filter(function(j){ return state.filter === "all" || j.status === state.filter; })
    .filter(function(j){ return !q || j.id.toLowerCase().indexOf(q) !== -1; })
    .slice()
    .sort(function(a, b){
      var d = ORDER[a.status] - ORDER[b.status];
      return d !== 0 ? d : (a.id < b.id ? -1 : 1);
    });
}

function renderFilters(){
  all(".chip-btn").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.filter === state.filter)); });
  all(".tile").forEach(function(t){ t.setAttribute("aria-pressed", String(t.dataset.status === state.filter)); });
}

function renderStatus(){
  $("#pulse").className = "pulse" + (state.syncing ? " syncing" : state.live ? "" : " paused");
  $("#liveLabel").textContent = state.live ? "Live" : "Paused";
  $("#liveBtnT").textContent = state.live ? "Pause" : "Resume";
  $("#liveBtn").querySelector("use").setAttribute("href", state.live ? "#i-pause" : "#i-play");
  $("#refreshBtn").disabled = state.syncing;
  $("#refreshIcon").classList.toggle("spin", state.syncing);

  var stamp = $("#stamp"), txt;
  if (state.syncing && !state.jobs) txt = "loading jobs";
  else if (state.syncing) txt = "syncing";
  else if (!state.lastSync) txt = "no data";
  else {
    var s = Math.round((Date.now() - state.lastSync) / 1000);
    txt = s < 2 ? "just now" : s < 60 ? s + "s ago" : Math.floor(s / 60) + "m ago";
  }
  if (stamp.textContent !== txt) stamp.textContent = txt;
}

function renderSummary(){
  var c = counts(state.jobs), loaded = !!state.jobs, x = 0;
  STATUSES.forEach(function(s){
    $("#n-" + s).textContent = loaded ? c[s] : "—";
    $("#f-" + s).textContent = loaded ? c[s] : "0";
    $("#sh-" + s).style.width = (loaded && c.total ? (c[s] / c.total * 100) : 0) + "%";
    var w = c.total ? (c[s] / c.total) * 400 : 0, r = $("#seg-" + s);
    r.setAttribute("x", String(x));
    r.setAttribute("width", String(w));
    x += w;
  });
  $("#f-all").textContent = loaded ? c.total : "0";
  $("#mixTotal").textContent = loaded ? c.total + " jobs" : "—";
  $(".tile.s-failed").classList.toggle("hot", c.failed > 0);

  var retrying = !!(state.bulk && state.bulk.kind === "retry");
  var btn = $("#retryAll");
  btn.disabled = retrying || c.failed === 0;
  $("#retryAllT").textContent = retrying ? "Retrying" : "Retry failed";
  $("#retryAllN").textContent = retrying ? (state.bulk.total - state.bulk.done) : c.failed;
  btn.querySelector(".ic").classList.toggle("spin", retrying);
}

function renderBars(){
  var bulkEl = $("#bulk");
  if (state.bulk){
    var pct = Math.round(state.bulk.done / state.bulk.total * 100);
    bulkEl.hidden = false;
    bulkEl.className = "bulkbar";
    bulkEl.innerHTML =
      '<span class="label">' + (state.bulk.kind === "retry" ? "Requeueing" : "Cancelling") + " " +
      state.bulk.done + " / " + state.bulk.total + "</span>" +
      '<div class="bar s-running" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct +
      '" aria-label="Bulk action progress"><i style="width:' + pct + '%"></i></div>';
  } else if (!bulkEl.hidden){
    bulkEl.hidden = true;
    bulkEl.innerHTML = "";
  }

  var sel = $("#selbar");
  var picked = Array.from(state.selected).filter(function(id){ return !!jobById(id); });
  if (picked.length !== state.selected.size) state.selected = new Set(picked);
  if (picked.length){
    var canRetry = picked.filter(isFailed), canCancel = picked.filter(isLive);
    sel.hidden = false;
    sel.className = "selbar";
    sel.innerHTML =
      '<span class="n">' + picked.length + " selected</span>" +
      '<button class="btn sm" type="button" data-act="retry"' + (canRetry.length && !state.bulk ? "" : " disabled") + ">" +
        icon("retry") + "Retry " + canRetry.length + "</button>" +
      '<button class="btn sm danger" type="button" data-act="cancel"' + (canCancel.length && !state.bulk ? "" : " disabled") + ">" +
        icon("stop") + "Cancel " + canCancel.length + "</button>" +
      '<span class="grow"></span>' +
      '<button class="btn sm" type="button" data-act="clear">Clear</button>';
    sel.onclick = function(ev){
      var b = ev.target.closest("button[data-act]");
      if (!b) return;
      if (b.dataset.act === "clear"){ state.selected.clear(); render(); }
      else if (b.dataset.act === "retry") runBulk("retry", canRetry);
      else askCancel(canCancel);
    };
  } else if (!sel.hidden){
    sel.hidden = true;
    sel.innerHTML = "";
  }

  var banner = $("#banner");
  if (state.listError){
    banner.hidden = false;
    banner.className = "banner";
    banner.innerHTML = icon("alert") + "<span>" + esc(state.listError) + "</span>" +
      '<span class="grow"></span><button class="btn sm" type="button">' + icon("refresh") + "Try again</button>";
    banner.querySelector("button").onclick = function(){ sync(); };
  } else if (!banner.hidden){
    banner.hidden = true;
    banner.innerHTML = "";
  }
}

function renderTable(){
  var tbody = $("#tbody");

  if (!state.jobs){
    if (tbody.dataset.mode !== "sk"){
      tbody.dataset.mode = "sk";
      rowEls.clear();
      tbody.innerHTML = skeletonHTML();
    }
    $("#selAll").disabled = true;
    return;
  }
  $("#selAll").disabled = false;

  var list = visibleJobs();
  if (!list.length){
    tbody.dataset.mode = "empty";
    rowEls.clear();
    var hasJobs = state.jobs.length > 0;
    tbody.innerHTML =
      '<tr><td colspan="6" class="pad"><div class="empty">' + icon("inbox") +
      '<div class="hd">' + (hasJobs ? "No jobs match this view" : "Queue is empty") + "</div>" +
      (hasJobs ? '<button class="btn sm" type="button" id="clearF">Clear filters</button>' : "") +
      "</div></td></tr>";
    var cf = $("#clearF");
    if (cf) cf.onclick = function(){
      state.filter = "all";
      state.query = "";
      $("#q").value = "";
      render();
    };
    return;
  }

  if (tbody.dataset.mode !== "rows"){
    tbody.dataset.mode = "rows";
    rowEls.clear();
    tbody.innerHTML = "";
  }

  var seen = new Set();
  list.forEach(function(job, i){
    var refs = rowEls.get(job.id) || createRow(job.id);
    updateRow(refs, job);
    seen.add(job.id);
    if (tbody.children[i] !== refs.tr) tbody.insertBefore(refs.tr, tbody.children[i] || null);
  });
  rowEls.forEach(function(refs, id){
    if (!seen.has(id)){
      if (refs.tr.parentNode) refs.tr.parentNode.removeChild(refs.tr);
      rowEls.delete(id);
    }
  });

  var allSel = list.every(function(j){ return state.selected.has(j.id); });
  $("#selAll").checked = allSel;
  $("#selAll").indeterminate = !allSel && list.some(function(j){ return state.selected.has(j.id); });
}

function renderDrawer(){
  if (!state.drawerId) return;
  var job = state.drawerJob, body = $("#drBody"), acts = $("#drActs");
  $("#drTitle").textContent = state.drawerId;

  if (!job){
    body.innerHTML = '<div class="sk" style="height:92px;border-radius:12px"></div>' +
      '<div class="sk" style="height:56px;border-radius:10px"></div>';
    acts.innerHTML = "";
    return;
  }

  var pct = Math.max(0, Math.min(100, Math.round(job.progress || 0)));
  var C = 2 * Math.PI * 34;
  var pending = state.pending.get(job.id) || null;
  var stroke = job.status === "failed" ? "var(--fail)" :
               job.status === "succeeded" ? "var(--ok)" :
               job.status === "queued" ? "var(--queued)" : "var(--running)";

  var html =
    '<div class="ring">' +
      '<svg viewBox="0 0 80 80" role="img" aria-label="' + pct + ' percent complete">' +
        '<circle class="track" cx="40" cy="40" r="34"></circle>' +
        '<circle class="val" cx="40" cy="40" r="34" style="stroke:' + stroke +
          ";stroke-dasharray:" + C.toFixed(1) + ";stroke-dashoffset:" + (C * (1 - pct / 100)).toFixed(1) + '"></circle>' +
      "</svg>" +
      '<div><div class="lbl">' + pct + "%</div>" +
      '<div class="sub"><span class="chip s-' + job.status + '"><span class="dot"></span>' + cap(job.status) + "</span></div></div>" +
    "</div>" +
    '<dl class="kv">' +
      "<dt>Job ID</dt><dd>" + esc(job.id) + "</dd>" +
      "<dt>Progress</dt><dd>" + pct + " / 100</dd>" +
      (job.result && typeof job.result.rows === "number" ? "<dt>Rows</dt><dd>" + job.result.rows.toLocaleString() + "</dd>" : "") +
    "</dl>";

  if (job.status === "failed" && job.error){
    html += '<div class="block err"><div class="hd">' + icon("alert") + "Failure reason</div>" +
      '<div class="msg">' + esc(job.error) + "</div></div>";
  }
  if (job.status === "succeeded" && job.result && job.result.downloadUrl){
    html += '<div class="block"><div class="hd">' + icon("check") + "Result ready</div>" +
      '<div class="note ok"><a href="' + esc(job.result.downloadUrl) + '" download>' + icon("download") + "Download result</a></div></div>";
  }
  var rowErr = state.rowError.get(job.id);
  if (rowErr){
    html += '<div class="block err"><div class="hd">' + icon("alert") + "Action failed</div>" +
      '<div class="msg">' + esc(rowErr) + "</div></div>";
  }
  body.innerHTML = html;

  if (job.status === "failed"){
    acts.innerHTML = '<button class="btn primary" type="button" data-act="retry"' + (pending ? " disabled" : "") + ">" +
      icon("retry", pending === "retry" ? "spin" : "") + (pending === "retry" ? "Retrying" : "Retry job") + "</button>";
  } else if (job.status === "running" || job.status === "queued"){
    acts.innerHTML = '<button class="btn danger" type="button" data-act="cancel"' + (pending ? " disabled" : "") + ">" +
      icon("stop", pending === "cancel" ? "spin" : "") + (pending === "cancel" ? "Cancelling" : "Cancel job") + "</button>";
  } else {
    acts.innerHTML = "";
  }
  acts.onclick = function(ev){
    var b = ev.target.closest("button[data-act]");
    if (!b || !state.drawerId) return;
    if (b.dataset.act === "retry") runOne(state.drawerId, "retry");
    else askCancel([state.drawerId]);
  };
}

var frame = null;
function render(){
  if (frame) return;
  frame = requestAnimationFrame(function(){
    frame = null;
    renderFilters();
    renderStatus();
    renderSummary();
    renderBars();
    renderTable();
    renderDrawer();
  });
}

/* ---------------- wiring ---------------- */
$("#retryAll").addEventListener("click", function(){
  if (state.bulk) return;                       // guards a second click before the repaint
  runBulk("retry", idsWith(function(j){ return j.status === "failed"; }));
});
$("#refreshBtn").addEventListener("click", function(){ sync(); });
$("#liveBtn").addEventListener("click", function(){
  state.live = !state.live;
  if (state.live) sync(); else clearTimeout(pollTimer);
  render();
});
all(".tile").forEach(function(t){
  t.addEventListener("click", function(){
    state.filter = state.filter === t.dataset.status ? "all" : t.dataset.status;
    render();
  });
});
all(".chip-btn").forEach(function(b){
  b.addEventListener("click", function(){ state.filter = b.dataset.filter; render(); });
});
$("#q").addEventListener("input", function(e){ state.query = e.target.value; render(); });
$("#selAll").addEventListener("change", function(e){
  visibleJobs().forEach(function(j){
    if (e.target.checked) state.selected.add(j.id); else state.selected.delete(j.id);
  });
  render();
});
setInterval(function(){ if (!state.syncing) renderStatus(); }, 1000);

if (!api || typeof api.listJobs !== "function"){
  state.listError = "Queue service is unreachable from this page.";
  render();
} else {
  render();      // paints the skeleton before the first request resolves
  sync();
}
})();
</script>
</body>
</html>
