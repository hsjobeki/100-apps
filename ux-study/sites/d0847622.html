<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job queue — admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0d12;
  --card:#111823;
  --card2:#0f1620;
  --line:#1e2836;
  --line2:#2a3646;
  --tx:#e8eef6;
  --mut:#8797ab;
  --mut2:#61708a;
  --acc:#4aa8ff;
  --queued:#8492ad;
  --running:#4aa8ff;
  --ok:#31c777;
  --bad:#ff5d54;
  --warn:#ffb020;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 500px at 78% -12%, #16283d 0%, rgba(13,19,28,0) 62%),
    var(--bg);
  color:var(--tx);
  font:14px/1.45 Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
a{color:var(--acc)}

/* ---------- shell ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px 20px 90px}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:4px 0 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(150deg,#28405e,#16202e);display:grid;place-items:center;border:1px solid var(--line2);flex:none}
h1{font-size:17px;font-weight:600;margin:0;letter-spacing:.1px;white-space:nowrap}
.spacer{flex:1 1 auto}
.sync{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12.5px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:9px;border:1px solid var(--line2);background:var(--card);color:var(--tx);font-size:13px;font-weight:500;text-decoration:none;transition:border-color .12s,background .12s,opacity .12s}
.btn:hover:not(:disabled){border-color:#3b4b61;background:#16202c}
.btn:disabled{opacity:.5}
.btn.prim{background:#1c4b7d;border-color:#2a6ba8}
.btn.prim:hover:not(:disabled){background:#22598f}
.btn.danger{background:#3a1512;border-color:#6d2822;color:#ffb3ad}
.btn.danger:hover:not(:disabled){background:#4a1a16}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:8px}
.btn.ghost{background:transparent}
.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.livebtn .ld{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(49,199,119,.55);animation:pulse 2s infinite}
.livebtn[aria-pressed="false"] .ld{background:var(--mut2);animation:none;box-shadow:none}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(49,199,119,0)}100%{box-shadow:0 0 0 0 rgba(49,199,119,0)}}

/* ---------- boards ---------- */
.board{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h2{margin:0 0 12px;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mut2)}

.overview{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut{position:relative;width:132px;height:132px;flex:none}
.donut svg{transform:rotate(-90deg)}
.donut .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:1px}
.donut .ctr b{font-size:27px;font-weight:600;letter-spacing:-.5px;font-family:"JetBrains Mono",monospace}
.donut .ctr span{font-size:11px;color:var(--mut2);letter-spacing:.06em;text-transform:uppercase}

.chips{display:flex;flex-wrap:wrap;gap:8px;flex:1 1 260px;min-width:0}
.chip{display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#0d141d;min-width:112px;flex:1 1 112px;transition:border-color .12s,background .12s}
.chip:hover{border-color:var(--line2);background:#121b26}
.chip[aria-pressed="true"]{border-color:#3d5876;background:#15212e;box-shadow:inset 0 0 0 1px rgba(74,168,255,.14)}
.chip .sw{width:9px;height:9px;border-radius:3px;flex:none}
.chip .cl{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;min-width:0}
.chip .cn{font-size:16px;font-weight:600;font-family:"JetBrains Mono",monospace}
.chip .ct{font-size:11.5px;color:var(--mut)}
.sw.all{background:linear-gradient(135deg,#4aa8ff,#31c777)}
.sw.queued{background:var(--queued)} .sw.running{background:var(--running)}
.sw.succeeded{background:var(--ok)} .sw.failed{background:var(--bad)}

/* ---------- enqueue ---------- */
.drop{display:flex;align-items:center;gap:11px;width:100%;padding:13px;border:1px dashed #33435a;border-radius:10px;background:#0d141d;color:var(--mut);text-align:left;transition:border-color .12s,background .12s,color .12s}
.drop:hover,.drop.over{border-color:var(--acc);color:var(--tx);background:#101c29}
.drop b{color:var(--tx);font-weight:500;font-size:13px;display:block}
.drop small{font-size:11.5px;color:var(--mut2)}
.up{display:flex;flex-direction:column;gap:9px}
.up .l1{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.up .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut)}
.up .l2{display:flex;align-items:center;gap:10px}
progress{appearance:none;-webkit-appearance:none;width:100%;height:8px;border:0;border-radius:99px;background:#1a2432;overflow:hidden}
progress::-webkit-progress-bar{background:#1a2432;border-radius:99px}
progress::-webkit-progress-value{background:linear-gradient(90deg,#3b8fe0,#4aa8ff);border-radius:99px;transition:width .2s}
progress::-moz-progress-bar{background:#4aa8ff;border-radius:99px}
progress:indeterminate::-webkit-progress-bar{background:linear-gradient(90deg,#1a2432 35%,#3b6ea8 50%,#1a2432 65%);background-size:220% 100%;animation:slide 1.1s linear infinite}
@keyframes slide{from{background-position:120% 0}to{background-position:-20% 0}}
.pctnum{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--mut);width:42px;text-align:right;flex:none}
.stages{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mut2)}
.stages i{width:6px;height:6px;border-radius:50%;background:#2a3646;display:inline-block}
.stages .st.on{color:var(--tx)} .stages .st.on i{background:var(--acc)}
.stages .st.done{color:var(--mut)} .stages .st.done i{background:var(--ok)}
.note{font-size:12.5px;display:flex;align-items:flex-start;gap:8px;line-height:1.4;margin:0}
.note.err{color:#ffb3ad} .note.ok{color:#9be7c0} .note.mut{color:var(--mut)}

/* ---------- alert strip ---------- */
.alert{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:var(--r);border:1px solid #63241f;background:linear-gradient(90deg,#2a100e,#180e12);margin:14px 0 0}
.alert.net{border-color:#6b4a14;background:linear-gradient(90deg,#2a1e08,#181410)}
.alert .txt{flex:1 1 auto;font-size:13.5px}
.alert b{font-weight:600}

/* ---------- table ---------- */
.tablecard{margin-top:14px;padding:0;overflow:hidden}
.thead{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.thead h2{margin:0}
.jt{width:100%;border-collapse:collapse}
.jt th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut2);font-weight:600;text-align:left;padding:8px 14px;border-bottom:1px solid var(--line);background:#0c121a}
.jt td{padding:11px 14px;border-bottom:1px solid #151d28;vertical-align:middle}
.jt tbody tr:last-child td{border-bottom:0}
.jt tbody tr{transition:background .12s}
.jt tbody tr:hover{background:#111a25}
.jt tbody tr.sel{background:#13202e}
.jt tbody tr.flash{animation:flash 2.4s ease-out}
@keyframes flash{0%{background:#123a2a}100%{background:transparent}}
.c-status{width:126px} .c-prog{width:190px} .c-act{width:160px;text-align:right}
.c-detail{color:var(--mut);font-size:13px;max-width:330px}

.pill{display:inline-flex;align-items:center;gap:7px;padding:3px 9px 3px 7px;border-radius:99px;font-size:12px;font-weight:500;border:1px solid transparent;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;flex:none}
.pill.queued{color:#c3cede;background:rgba(132,146,173,.14);border-color:rgba(132,146,173,.3)}
.pill.queued .dot{background:var(--queued)}
.pill.running{color:#a9d6ff;background:rgba(74,168,255,.14);border-color:rgba(74,168,255,.34)}
.pill.running .dot{background:var(--running);animation:pulse2 1.4s infinite}
@keyframes pulse2{0%,100%{opacity:1}50%{opacity:.35}}
.pill.succeeded{color:#96e8bd;background:rgba(49,199,119,.13);border-color:rgba(49,199,119,.3)}
.pill.succeeded .dot{background:var(--ok)}
.pill.failed{color:#ffb3ad;background:rgba(255,93,84,.13);border-color:rgba(255,93,84,.34)}
.pill.failed .dot{background:var(--bad)}

.idbtn{font-family:"JetBrains Mono",monospace;font-size:13px;letter-spacing:-.2px;color:var(--tx);border-bottom:1px dashed #33435a;padding:1px 0}
.idbtn:hover{color:var(--acc);border-color:var(--acc)}
.bar{height:6px;border-radius:99px;background:#1a2432;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;position:relative;overflow:hidden;transition:width .35s ease}
.bar.queued i{background:var(--queued)} .bar.running i{background:linear-gradient(90deg,#2f7fc4,#4aa8ff)}
.bar.succeeded i{background:var(--ok)} .bar.failed i{background:var(--bad)}
.bar.running i::after{content:"";position:absolute;top:0;bottom:0;left:-16px;right:-16px;background:repeating-linear-gradient(115deg,rgba(255,255,255,.18) 0 7px,transparent 7px 14px);animation:march 1s linear infinite}
@keyframes march{to{transform:translateX(14px)}}
.progwrap{display:flex;align-items:center;gap:9px}
.progwrap .bar{flex:1 1 auto}
.errtx{color:#ff9a92;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowwarn{display:inline-flex;align-items:center;gap:6px;color:var(--warn);font-size:12px;margin-top:3px}
.acts{display:inline-flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.empty{padding:46px 20px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--tx);font-weight:600;font-size:15px;margin-bottom:8px}
.sk{height:13px;border-radius:6px;background:linear-gradient(90deg,#141d28 25%,#1c2836 37%,#141d28 63%);background-size:400% 100%;animation:sh 1.3s ease infinite}
@keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,8,12,.6);opacity:0;pointer-events:none;transition:opacity .16s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:400px;max-width:92vw;background:#0d141d;border-left:1px solid var(--line2);z-index:41;transform:translateX(102%);transition:transform .2s cubic-bezier(.3,.7,.3,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.dhead{display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid var(--line)}
.dbody{padding:16px 14px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.ring{display:flex;align-items:center;gap:14px}
.ring .rv{position:relative;width:84px;height:84px;flex:none}
.ring .rv svg{transform:rotate(-90deg)}
.ring .rv span{position:absolute;inset:0;display:grid;place-content:center;font-family:"JetBrains Mono",monospace;font-size:17px;font-weight:600}
.kv{display:grid;grid-template-columns:96px 1fr;gap:7px 12px;font-size:13px;margin:0}
.kv dt{color:var(--mut2)} .kv dd{margin:0;word-break:break-word}
.block{border:1px solid var(--line);border-radius:10px;padding:11px;background:#0f1620}
.block.bad{border-color:#5c2520;background:#1d0f0e}
.block.good{border-color:#1f5c3c;background:#0d1a14}
.block h3{margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut2);font-weight:600}
.block p{margin:0;font-size:13px;line-height:1.45}
.dfoot{margin-top:auto;padding:13px 14px;border-top:1px solid var(--line);display:flex;gap:8px}

/* ---------- toasts ---------- */
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:9px;z-index:60;max-width:380px}
.toast{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:11px;border:1px solid var(--line2);background:#141d29;box-shadow:0 12px 34px rgba(0,0,0,.5);animation:rise .18s ease-out}
.toast.bad{border-color:#5f2520;background:#1d1113}
.toast .tt{flex:1 1 auto;font-size:13px;line-height:1.4}
.toast .tt em{font-style:normal;color:var(--mut);display:block;font-size:12.2px;margin-top:2px}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:980px){
  .board{grid-template-columns:1fr}
}
@media (max-width:760px){
  .wrap{padding:14px 12px 80px}
  .c-status,.c-prog,.c-act{width:auto}
  .jt,.jt tbody,.jt tr,.jt td{display:block}
  .jt thead{display:none}
  .jt tbody{padding:10px;display:flex;flex-direction:column;gap:9px}
  .jt tbody tr{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;border:1px solid var(--line);border-radius:11px;padding:11px;background:#0f1620}
  .jt td{padding:0;border:0}
  .c-status{grid-column:1;align-self:center}
  .c-id{grid-column:2;align-self:center;text-align:right}
  .c-prog{grid-column:1/-1}
  .c-detail{grid-column:1/-1;max-width:none}
  .c-act{grid-column:1/-1;text-align:right}
  .toasts{left:12px;right:12px;max-width:none}
  .donut{margin:0 auto}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7fb6f0" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="5" rx="1.5"/><rect x="3" y="12" width="18" height="5" rx="1.5"/><path d="M7 20h10"/></svg>
      </span>
      <h1>Job queue</h1>
    </div>
    <div class="spacer"></div>
    <div class="sync"><span id="ago">Loading…</span></div>
    <button class="btn" id="refresh" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      Refresh
    </button>
    <button class="btn livebtn" id="live" type="button" aria-pressed="true">
      <span class="ld" aria-hidden="true"></span><span id="livetx">Live</span>
    </button>
  </header>

  <div class="board">
    <section class="card" aria-labelledby="ov-h">
      <h2 id="ov-h">Queue</h2>
      <div class="overview">
        <div class="donut">
          <svg width="132" height="132" viewBox="0 0 132 132" aria-hidden="true">
            <circle cx="66" cy="66" r="50" fill="none" stroke="#18212d" stroke-width="15"/>
            <circle class="seg" data-seg="failed"    cx="66" cy="66" r="50" fill="none" stroke="#ff5d54" stroke-width="15" stroke-dasharray="0 999"/>
            <circle class="seg" data-seg="running"   cx="66" cy="66" r="50" fill="none" stroke="#4aa8ff" stroke-width="15" stroke-dasharray="0 999"/>
            <circle class="seg" data-seg="queued"    cx="66" cy="66" r="50" fill="none" stroke="#8492ad" stroke-width="15" stroke-dasharray="0 999"/>
            <circle class="seg" data-seg="succeeded" cx="66" cy="66" r="50" fill="none" stroke="#31c777" stroke-width="15" stroke-dasharray="0 999"/>
          </svg>
          <div class="ctr"><b id="dtot">—</b><span>jobs</span></div>
        </div>
        <div class="chips" id="chips" role="group" aria-label="Filter by status">
          <button class="chip" type="button" data-filter="all" aria-pressed="true"><span class="sw all"></span><span class="cl"><span class="cn" data-c="all">—</span><span class="ct">All</span></span></button>
          <button class="chip" type="button" data-filter="failed" aria-pressed="false"><span class="sw failed"></span><span class="cl"><span class="cn" data-c="failed">—</span><span class="ct">Failed</span></span></button>
          <button class="chip" type="button" data-filter="running" aria-pressed="false"><span class="sw running"></span><span class="cl"><span class="cn" data-c="running">—</span><span class="ct">Running</span></span></button>
          <button class="chip" type="button" data-filter="queued" aria-pressed="false"><span class="sw queued"></span><span class="cl"><span class="cn" data-c="queued">—</span><span class="ct">Queued</span></span></button>
          <button class="chip" type="button" data-filter="succeeded" aria-pressed="false"><span class="sw succeeded"></span><span class="cl"><span class="cn" data-c="succeeded">—</span><span class="ct">Succeeded</span></span></button>
        </div>
      </div>
    </section>

    <section class="card" aria-labelledby="enq-h">
      <h2 id="enq-h">Enqueue</h2>
      <div id="enq"></div>
      <input type="file" id="fileinput" class="vh" accept=".csv,text/csv">
    </section>
  </div>

  <div id="alerts" aria-live="polite"></div>

  <section class="card tablecard" aria-labelledby="jt-h">
    <div class="thead"><h2 id="jt-h">Jobs</h2><span class="spacer"></span><span class="sync mono" id="shown"></span></div>
    <table class="jt">
      <thead>
        <tr><th scope="col">Status</th><th scope="col">Job</th><th scope="col">Progress</th><th scope="col">Detail</th><th scope="col"><span class="vh">Actions</span></th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="tstate"></div>
  </section>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dtitle" aria-hidden="true">
  <div class="dhead">
    <strong id="dtitle" class="mono" style="font-size:14px">Job</strong>
    <span class="spacer"></span>
    <button class="btn sm ghost" id="dclose" type="button">Close</button>
  </div>
  <div class="dbody" id="dbody"></div>
  <div class="dfoot" id="dfoot"></div>
</aside>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(function () {
  "use strict";
  var api = window.api;
  var ORDER = { failed: 0, running: 1, queued: 2, succeeded: 3 };
  var LABEL = { queued: "Queued", running: "Running", succeeded: "Succeeded", failed: "Failed" };

  var state = {
    jobs: [],
    loaded: false,
    filter: "all",
    live: true,
    netError: null,
    lastSync: 0,
    pending: new Set(),   // job ids with an in-flight action
    rowErr: new Map(),    // job id -> { msg, kind }
    flash: new Set(),
    bulk: null,           // { done, total }
    drawerId: null,
    drawerJob: null,
    drawerErr: null
  };

  var up = { stage: "idle", pct: 0, file: null, err: null, jobId: null };
  var upCtl = null;

  function $(id) { return document.getElementById(id); }
  var tbody = $("tbody"), tstate = $("tstate"), enq = $("enq"), alerts = $("alerts");

  /* ---------------- helpers ---------------- */
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function errText(e) {
    if (!e) return "Unknown error";
    if (e.name === "AbortError") return "Cancelled";
    if (e.code === "NETWORK") return "Network request failed";
    if (e.code === "NOT_FOUND") return "Job no longer exists";
    return e.message || String(e);
  }
  function ago(ms) {
    var s = Math.round((Date.now() - ms) / 1000);
    if (s < 2) return "just now";
    if (s < 60) return s + "s ago";
    return Math.floor(s / 60) + "m ago";
  }
  function num(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
  function ico(name, size) {
    var p = {
      retry: '<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>',
      x: '<path d="M18 6 6 18M6 6l12 12"/>',
      alert: '<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>',
      up: '<path d="M12 16V4"/><path d="m6 10 6-6 6 6"/><path d="M4 20h16"/>',
      dl: '<path d="M12 4v12"/><path d="m6 12 6 6 6-6"/><path d="M4 20h16"/>',
      check: '<path d="m20 6-11 11-5-5"/>'
    }[name];
    var s = size || 14;
    return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + "</svg>";
  }
  var SPIN = '<svg class="spin" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 0 1 9 9"/><path opacity=".3" d="M21 12a9 9 0 1 1-9-9"/></svg>';

  function counts() {
    var c = { all: state.jobs.length, queued: 0, running: 0, succeeded: 0, failed: 0 };
    for (var i = 0; i < state.jobs.length; i++) {
      var s = state.jobs[i].status;
      if (c[s] !== undefined) c[s]++;
    }
    return c;
  }
  function rank(s) { return ORDER[s] === undefined ? 9 : ORDER[s]; }
  function visibleJobs() {
    var f = state.filter;
    var list = state.jobs.filter(function (j) { return f === "all" || j.status === f; });
    list.sort(function (a, b) {
      var d = rank(a.status) - rank(b.status);
      return d !== 0 ? d : (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
    });
    return list;
  }

  /* ---------------- toasts ---------------- */
  function toast(text, opts) {
    opts = opts || {};
    var good = opts.bad === false;
    var n = document.createElement("div");
    n.className = "toast" + (good ? "" : " bad");

    var icon = document.createElement("span");
    icon.style.color = good ? "#31c777" : "#ff5d54";
    icon.innerHTML = ico(good ? "check" : "alert", 16);
    n.appendChild(icon);

    var body = document.createElement("div");
    body.className = "tt";
    body.textContent = text;
    if (opts.sub) {
      var em = document.createElement("em");
      em.textContent = opts.sub;
      body.appendChild(em);
    }
    n.appendChild(body);

    if (opts.action) {
      var ab = document.createElement("button");
      ab.className = "btn sm";
      ab.type = "button";
      ab.textContent = opts.action.label;
      ab.addEventListener("click", function () { n.remove(); opts.action.run(); });
      n.appendChild(ab);
    }
    var cb = document.createElement("button");
    cb.className = "btn sm ghost";
    cb.type = "button";
    cb.setAttribute("aria-label", "Dismiss");
    cb.innerHTML = ico("x", 13);
    cb.addEventListener("click", function () { n.remove(); });
    n.appendChild(cb);

    $("toasts").appendChild(n);
    setTimeout(function () { n.remove(); }, opts.action ? 14000 : 8000);
  }

  /* ---------------- polling ---------------- */
  var syncing = false, timer = null;

  function schedule() {
    clearTimeout(timer);
    if (!state.live) return;
    timer = setTimeout(function () { sync(); }, 2000);
  }

  function sync() {
    if (syncing) return Promise.resolve();
    syncing = true;
    paintSync();
    return api.listJobs().then(function (jobs) {
      state.jobs = jobs || [];
      state.loaded = true;
      state.netError = null;
    }, function (e) {
      state.netError = errText(e);
    }).then(function () {
      syncing = false;
      state.lastSync = Date.now();
      render();
      schedule();
    });
  }

  function upsert(job) {
    if (!job || !job.id) return;
    for (var i = 0; i < state.jobs.length; i++) {
      if (state.jobs[i].id === job.id) { state.jobs[i] = job; return; }
    }
    state.jobs.push(job);
  }

  function paintSync() {
    var b = $("refresh");
    b.disabled = syncing;
    var svg = b.querySelector("svg");
    if (svg) svg.classList.toggle("spin", syncing);
    $("ago").textContent = syncing ? "Syncing…" : (state.loaded ? "Updated " + ago(state.lastSync) : "Loading…");
  }
  setInterval(function () {
    if (!syncing && state.loaded) $("ago").textContent = "Updated " + ago(state.lastSync);
  }, 1000);

  /* ---------------- job actions ---------------- */
  function act(kind, id) {
    if (state.pending.has(id)) return Promise.resolve(false);
    state.pending.add(id);
    state.rowErr.delete(id);
    render();
    var call = kind === "cancel" ? api.cancelJob(id) : api.retryJob(id);
    return call.then(function (snap) {
      state.pending.delete(id);
      upsert(snap);
      render();
      return true;
    }, function (e) {
      var msg = errText(e);
      state.pending.delete(id);
      state.rowErr.set(id, { msg: (kind === "cancel" ? "Cancel failed: " : "Retry failed: ") + msg, kind: kind });
      render();
      toast((kind === "cancel" ? "Couldn't cancel " : "Couldn't retry ") + id, {
        sub: msg,
        action: { label: "Try again", run: function () { act(kind, id); } }
      });
      return false;
    });
  }

  function retryAllFailed() {
    if (state.bulk) return;
    var ids = state.jobs.filter(function (j) { return j.status === "failed" && !state.pending.has(j.id); })
                        .map(function (j) { return j.id; });
    if (!ids.length) return;
    state.bulk = { done: 0, total: ids.length };
    render();
    var failures = [], next = 0;

    function lane() {
      if (next >= ids.length) return Promise.resolve();
      var id = ids[next++];
      return act("retry", id).then(function (ok) {
        if (!ok) failures.push(id);
        state.bulk.done++;
        render();
        return lane();
      });
    }
    var lanes = [];
    for (var i = 0; i < Math.min(3, ids.length); i++) lanes.push(lane());
    Promise.all(lanes).then(function () {
      state.bulk = null;
      render();
      if (failures.length) {
        toast(failures.length + " of " + ids.length + " retries failed", {
          sub: "The server rejected them. Those jobs are still failed.",
          action: { label: "Try again", run: retryAllFailed }
        });
      } else {
        toast(ids.length + (ids.length === 1 ? " job requeued" : " jobs requeued"), { bad: false });
      }
      sync();
    });
  }

  /* ---------------- upload ---------------- */
  function setUp(patch) {
    for (var k in patch) up[k] = patch[k];
    renderUp();
  }

  function startUpload(file) {
    if (up.stage === "upload" || up.stage === "queue") return;
    upCtl = new AbortController();
    var signal = upCtl.signal;
    setUp({ stage: "upload", pct: 0, file: file, err: null, jobId: null });
    api.uploadFile(file, {
      signal: signal,
      onProgress: function (p) {
        if (up.stage === "upload") setUp({ pct: Math.max(0, Math.min(100, Math.round(p))) });
      }
    }).then(function (r) {
      setUp({ stage: "queue" });
      return api.processFile(r.fileId, { signal: signal });
    }).then(function (r) {
      setUp({ stage: "done", jobId: r.jobId });
      state.flash.add(r.jobId);
      setTimeout(function () { state.flash.delete(r.jobId); }, 2600);
      sync();
      setTimeout(function () {
        if (up.stage === "done" && up.jobId === r.jobId) setUp({ stage: "idle" });
      }, 7000);
    }, function (e) {
      if (e && e.name === "AbortError") setUp({ stage: "cancelled" });
      else setUp({ stage: "error", err: errText(e) });
    });
  }

  function renderUp() {
    var h = "";
    if (up.stage === "idle" || up.stage === "cancelled") {
      h = '<button class="drop" type="button" id="pick">' + ico("up", 18) +
          "<span><b>Upload a CSV</b><small>Creates one job</small></span></button>";
      if (up.stage === "cancelled") h += '<p class="note mut" style="margin-top:9px">Upload cancelled.</p>';
    } else if (up.stage === "upload" || up.stage === "queue") {
      var uploading = up.stage === "upload";
      h = '<div class="up">' +
          '<div class="l1">' + SPIN + '<span class="fn">' + escapeHtml(up.file ? up.file.name : "file") + "</span></div>" +
          '<div class="l2"><progress max="100"' + (uploading ? ' value="' + up.pct + '"' : "") + "></progress>" +
          '<span class="pctnum">' + (uploading ? up.pct + "%" : "—") + "</span></div>" +
          '<div class="stages">' +
          '<span class="st ' + (uploading ? "on" : "done") + '"><i></i> Uploading</span>' +
          '<span style="opacity:.4">›</span>' +
          '<span class="st ' + (uploading ? "" : "on") + '"><i></i> Queuing</span></div>' +
          '<button class="btn sm" type="button" id="upcancel">' + ico("x", 13) + " Cancel</button></div>";
    } else if (up.stage === "done") {
      h = '<div class="up"><p class="note ok">' + ico("check", 15) +
          '<span>Queued <span class="mono">' + escapeHtml(up.jobId) + "</span></span></p>" +
          '<button class="btn sm" type="button" id="pick2">Upload another</button></div>';
    } else if (up.stage === "error") {
      h = '<div class="up"><p class="note err">' + ico("alert", 15) + "<span>" + escapeHtml(up.err) + "</span></p>" +
          '<div style="display:flex;gap:7px"><button class="btn sm prim" type="button" id="upretry">' + ico("retry", 13) +
          ' Retry</button><button class="btn sm ghost" type="button" id="updismiss">Dismiss</button></div></div>';
    }
    enq.innerHTML = h;

    var pick = $("pick") || $("pick2");
    if (pick) pick.addEventListener("click", function () { $("fileinput").click(); });
    var c = $("upcancel");
    if (c) c.addEventListener("click", function () {
      c.disabled = true;
      c.innerHTML = SPIN + " Cancelling";
      if (upCtl) upCtl.abort();
    });
    var r = $("upretry");
    if (r) r.addEventListener("click", function () { if (up.file) startUpload(up.file); });
    var d = $("updismiss");
    if (d) d.addEventListener("click", function () { setUp({ stage: "idle", err: null }); });
  }

  $("fileinput").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (f) startUpload(f);
  });
  ["dragenter", "dragover"].forEach(function (t) {
    document.addEventListener(t, function (e) {
      if (!e.dataTransfer || !e.dataTransfer.types) return;
      if (Array.prototype.indexOf.call(e.dataTransfer.types, "Files") < 0) return;
      e.preventDefault();
      var d = enq.querySelector(".drop");
      if (d) d.classList.add("over");
    });
  });
  ["dragleave", "drop"].forEach(function (t) {
    document.addEventListener(t, function (e) {
      var d = enq.querySelector(".drop");
      if (d) d.classList.remove("over");
      if (t === "drop" && e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) {
        e.preventDefault();
        startUpload(e.dataTransfer.files[0]);
      }
    });
  });

  /* ---------------- rows ---------------- */
  var rows = new Map();

  function makeRow(id) {
    var tr = document.createElement("tr");
    tr.dataset.id = id;
    tr.innerHTML =
      '<td class="c-status"><span class="pill"><span class="dot"></span><span class="pt"></span></span></td>' +
      '<td class="c-id"><button class="idbtn" type="button" data-act="open"></button></td>' +
      '<td class="c-prog"><div class="progwrap"><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i></i></div><span class="pctnum"></span></div></td>' +
      '<td class="c-detail"><span class="dt"></span><span class="wn"></span></td>' +
      '<td class="c-act"><span class="acts"></span></td>';
    var r = {
      tr: tr,
      pill: tr.querySelector(".pill"),
      ptx: tr.querySelector(".pt"),
      idb: tr.querySelector(".idbtn"),
      bar: tr.querySelector(".bar"),
      fill: tr.querySelector(".bar > i"),
      pct: tr.querySelector(".c-prog .pctnum"),
      dt: tr.querySelector(".dt"),
      wn: tr.querySelector(".wn"),
      acts: tr.querySelector(".acts"),
      sig: "",
      warnSig: ""
    };
    r.idb.dataset.id = id;
    rows.set(id, r);
    return r;
  }

  function updateRow(job) {
    var r = rows.get(job.id) || makeRow(job.id);
    var pend = state.pending.has(job.id);
    var warn = state.rowErr.get(job.id);
    var raw = Math.max(0, Math.min(100, Math.round(job.progress || 0)));
    var pct = job.status === "succeeded" ? 100 : raw;

    if (r.pill.className !== "pill " + job.status) {
      r.pill.className = "pill " + job.status;
      r.bar.className = "bar " + job.status;
      r.ptx.textContent = LABEL[job.status] || job.status;
    }
    if (r.idb.textContent !== job.id) r.idb.textContent = job.id;

    if (r.fill.style.width !== pct + "%") r.fill.style.width = pct + "%";
    r.bar.setAttribute("aria-valuenow", String(pct));
    r.bar.setAttribute("aria-label", (LABEL[job.status] || job.status) + ", " + pct + "% done");
    var ptext = job.status === "queued" && pct === 0 ? "—" : pct + "%";
    if (r.pct.textContent !== ptext) r.pct.textContent = ptext;

    var detail = "", dcls = "dt";
    if (job.status === "failed") { detail = job.error || "Failed without a reported reason"; dcls = "dt errtx"; }
    else if (job.status === "succeeded" && job.result) { detail = num(job.result.rows) + " rows"; }
    if (r.dt.textContent !== detail) r.dt.textContent = detail;
    if (r.dt.className !== dcls) r.dt.className = dcls;
    if (job.status === "failed" && detail) r.dt.title = detail; else r.dt.removeAttribute("title");

    var wsig = warn ? warn.msg : "";
    if (r.warnSig !== wsig) {
      r.warnSig = wsig;
      r.wn.innerHTML = warn ? '<span class="rowwarn">' + ico("alert", 12) + escapeHtml(warn.msg) + "</span>" : "";
    }

    var sig = job.status + "|" + pend + "|" + (job.result && job.result.downloadUrl ? "d" : "");
    if (r.sig !== sig) {
      r.sig = sig;
      var h = "";
      if (pend) {
        h = '<button class="btn sm" type="button" disabled>' + SPIN + " Working</button>";
      } else if (job.status === "failed") {
        h = '<button class="btn sm prim" type="button" data-act="retry" data-id="' + job.id + '">' + ico("retry", 13) + " Retry</button>";
      } else if (job.status === "queued" || job.status === "running") {
        h = '<button class="btn sm" type="button" data-act="cancel" data-id="' + job.id + '">' + ico("x", 13) + " Cancel</button>";
      } else if (job.status === "succeeded") {
        if (job.result && job.result.downloadUrl) {
          h = '<a class="btn sm" href="' + escapeHtml(job.result.downloadUrl) + '" download>' + ico("dl", 13) + " Download</a>";
        }
        h += '<button class="btn sm ghost" type="button" data-act="retry" data-id="' + job.id + '">Rerun</button>';
      }
      r.acts.innerHTML = h;
    }

    r.tr.classList.toggle("sel", state.drawerId === job.id);
    r.tr.classList.toggle("flash", state.flash.has(job.id));
    return r.tr;
  }

  function renderTable() {
    if (!state.loaded) {
      if (tbody.childElementCount === 0) {
        var sk = "";
        for (var i = 0; i < 6; i++) {
          sk += '<tr class="skel"><td class="c-status"><div class="sk" style="width:86px"></div></td>' +
                '<td class="c-id"><div class="sk" style="width:94px"></div></td>' +
                '<td class="c-prog"><div class="sk" style="width:150px"></div></td>' +
                '<td class="c-detail"><div class="sk" style="width:' + (110 + i * 24) + 'px"></div></td>' +
                '<td class="c-act"><div class="sk" style="width:70px;margin-left:auto"></div></td></tr>';
        }
        tbody.innerHTML = sk;
      }
      return;
    }
    if (tbody.firstElementChild && tbody.firstElementChild.classList.contains("skel")) tbody.innerHTML = "";

    var list = visibleJobs();
    var seen = new Set();
    var prev = null;
    for (var i = 0; i < list.length; i++) {
      var tr = updateRow(list[i]);
      seen.add(list[i].id);
      var slot = prev ? prev.nextElementSibling : tbody.firstElementChild;
      if (slot !== tr) tbody.insertBefore(tr, slot);
      prev = tr;
    }
    rows.forEach(function (r, id) {
      if (!seen.has(id)) {
        if (r.tr.parentNode) r.tr.parentNode.removeChild(r.tr);
        rows.delete(id);
      }
    });

    var c = counts();
    var shown = list.length + " of " + c.all;
    if ($("shown").textContent !== shown) $("shown").textContent = shown;

    var eh = "";
    if (list.length === 0) {
      eh = c.all === 0
        ? '<div class="empty"><b>The queue is empty</b>Upload a CSV to enqueue the first job.</div>'
        : '<div class="empty"><b>No ' + (LABEL[state.filter] || "").toLowerCase() + ' jobs</b><button class="btn sm" type="button" id="clearf">Show all ' + c.all + "</button></div>";
    }
    if (tstate.dataset.h !== eh) {
      tstate.dataset.h = eh;
      tstate.innerHTML = eh;
      var cf = $("clearf");
      if (cf) cf.addEventListener("click", function () { setFilter("all"); });
    }
  }

  /* ---------------- overview + alerts ---------------- */
  function renderChips() {
    var c = counts();
    var chips = $("chips").querySelectorAll(".chip");
    for (var i = 0; i < chips.length; i++) {
      var f = chips[i].dataset.filter;
      chips[i].setAttribute("aria-pressed", String(state.filter === f));
      var n = chips[i].querySelector("[data-c]");
      var v = state.loaded ? String(c[f]) : "—";
      if (n.textContent !== v) n.textContent = v;
    }
    var C = 2 * Math.PI * 50, acc = 0, total = c.all;
    var segs = ["failed", "running", "queued", "succeeded"];
    for (var s = 0; s < segs.length; s++) {
      var el = document.querySelector('[data-seg="' + segs[s] + '"]');
      var len = total ? (c[segs[s]] / total) * C : 0;
      el.setAttribute("stroke-dasharray", len.toFixed(2) + " " + (C - len).toFixed(2));
      el.setAttribute("stroke-dashoffset", (-acc).toFixed(2));
      acc += len;
    }
    var t = state.loaded ? String(total) : "—";
    if ($("dtot").textContent !== t) $("dtot").textContent = t;
  }

  function renderAlerts() {
    var c = counts();
    var h = "";
    if (state.netError) {
      h += '<div class="alert net"><span style="color:#ffb020">' + ico("alert", 17) + "</span>" +
           '<span class="txt"><b>Lost contact with the server.</b> ' + escapeHtml(state.netError) +
           " — showing the last known state.</span>" +
           '<button class="btn sm" type="button" data-alert="resync">' + ico("retry", 13) + " Reconnect</button></div>";
    }
    if (state.loaded && c.failed > 0) {
      var busy = !!state.bulk;
      h += '<div class="alert"><span style="color:#ff5d54">' + ico("alert", 17) + "</span>" +
           '<span class="txt"><b>' + c.failed + (c.failed === 1 ? " job failed" : " jobs failed") +
           "</b> — retry sends them back to the queue.</span>" +
           '<button class="btn sm danger" type="button" data-alert="retryall"' + (busy ? " disabled" : "") + ">" +
           (busy ? SPIN + " Retrying " + state.bulk.done + "/" + state.bulk.total : ico("retry", 13) + " Retry all") +
           "</button></div>";
    }
    if (alerts.dataset.h !== h) {
      alerts.innerHTML = h;
      alerts.dataset.h = h;
    }
  }

  function render() {
    renderChips();
    renderAlerts();
    renderTable();
    renderDrawer();
    paintSync();
  }

  function setFilter(f) {
    state.filter = f;
    renderChips();
    renderTable();
  }

  /* ---------------- drawer ---------------- */
  var drawerToken = 0, lastFocus = null;

  function openDrawer(id) {
    lastFocus = document.activeElement;
    state.drawerId = id;
    state.drawerErr = null;
    state.drawerJob = state.jobs.filter(function (j) { return j.id === id; })[0] || null;
    $("dtitle").textContent = id;
    $("drawer").classList.add("on");
    $("drawer").setAttribute("aria-hidden", "false");
    $("scrim").classList.add("on");
    render();
    $("dclose").focus();

    var tok = ++drawerToken;
    (function poll() {
      if (tok !== drawerToken) return;
      api.getJob(id).then(function (j) {
        if (tok !== drawerToken) return;
        state.drawerJob = j;
        state.drawerErr = null;
        upsert(j);
        renderDrawer();
        renderTable();
      }, function (e) {
        if (tok !== drawerToken) return;
        state.drawerErr = errText(e);
        renderDrawer();
      }).then(function () {
        if (tok !== drawerToken) return;
        setTimeout(poll, 1500);
      });
    })();
  }

  function closeDrawer() {
    drawerToken++;
    state.drawerId = null;
    state.drawerJob = null;
    state.drawerErr = null;
    $("drawer").classList.remove("on");
    $("drawer").setAttribute("aria-hidden", "true");
    $("scrim").classList.remove("on");
    $("dbody").innerHTML = "";
    $("dfoot").innerHTML = "";
    renderTable();
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }

  function renderDrawer() {
    if (!state.drawerId) return;
    var j = state.drawerJob;
    var pend = state.pending.has(state.drawerId);

    if (!j) {
      $("dbody").innerHTML = state.drawerErr
        ? '<div class="block bad"><h3>Unavailable</h3><p>' + escapeHtml(state.drawerErr) + "</p></div>"
        : '<p class="note mut">' + SPIN + " Loading job…</p>";
      $("dfoot").innerHTML = "";
      return;
    }

    var pct = j.status === "succeeded" ? 100 : Math.max(0, Math.min(100, Math.round(j.progress || 0)));
    var color = { queued: "#8492ad", running: "#4aa8ff", succeeded: "#31c777", failed: "#ff5d54" }[j.status] || "#8492ad";
    var C = 2 * Math.PI * 34;
    var body =
      '<div class="ring"><div class="rv"><svg width="84" height="84" viewBox="0 0 84 84">' +
      '<circle cx="42" cy="42" r="34" fill="none" stroke="#18212d" stroke-width="9"/>' +
      '<circle cx="42" cy="42" r="34" fill="none" stroke="' + color + '" stroke-width="9" stroke-linecap="round" ' +
      'stroke-dasharray="' + ((pct / 100) * C).toFixed(2) + " " + C.toFixed(2) + '"/></svg>' +
      "<span>" + pct + "%</span></div><div>" +
      '<span class="pill ' + j.status + '"><span class="dot"></span><span>' + (LABEL[j.status] || j.status) + "</span></span>" +
      '<div class="note mut" style="margin-top:8px">' +
      (state.drawerErr ? "Updates paused — " + escapeHtml(state.drawerErr) : "Updating every 1.5s") +
      "</div></div></div>";

    body += '<dl class="kv"><dt>Job</dt><dd class="mono">' + escapeHtml(j.id) + "</dd>" +
            "<dt>Status</dt><dd>" + (LABEL[j.status] || j.status) + "</dd>" +
            "<dt>Progress</dt><dd>" + pct + "%</dd></dl>";

    if (j.status === "failed") {
      body += '<div class="block bad"><h3>Failure reason</h3><p>' + escapeHtml(j.error || "None reported") + "</p></div>";
    }
    if (j.status === "succeeded" && j.result) {
      body += '<div class="block good"><h3>Result</h3><p>' + num(j.result.rows) + " rows</p>" +
              '<p style="margin-top:8px"><a href="' + escapeHtml(j.result.downloadUrl) + '" download>Download output</a></p></div>';
    }
    var warn = state.rowErr.get(j.id);
    if (warn) body += '<p class="note err">' + ico("alert", 15) + "<span>" + escapeHtml(warn.msg) + "</span></p>";
    $("dbody").innerHTML = body;

    var foot;
    if (pend) {
      foot = '<button class="btn prim" type="button" disabled>' + SPIN + " Working</button>";
    } else if (j.status === "failed") {
      foot = '<button class="btn prim" type="button" data-act="retry" data-id="' + j.id + '">' + ico("retry", 14) + " Retry job</button>";
    } else if (j.status === "queued" || j.status === "running") {
      foot = '<button class="btn danger" type="button" data-act="cancel" data-id="' + j.id + '">' + ico("x", 14) + " Cancel job</button>";
    } else {
      foot = '<button class="btn" type="button" data-act="retry" data-id="' + j.id + '">' + ico("retry", 14) + " Rerun job</button>";
    }
    $("dfoot").innerHTML = foot;
  }

  /* ---------------- events ---------------- */
  document.addEventListener("click", function (e) {
    if (!e.target || !e.target.closest) return;
    var t = e.target.closest("[data-act]");
    if (t) {
      var id = t.dataset.id;
      if (t.dataset.act === "open") { openDrawer(id); return; }
      if (t.dataset.act === "retry") { act("retry", id); return; }
      if (t.dataset.act === "cancel") { act("cancel", id); return; }
    }
    var chip = e.target.closest(".chip");
    if (chip) { setFilter(chip.dataset.filter); return; }
    var al = e.target.closest("[data-alert]");
    if (al) {
      if (al.dataset.alert === "retryall") { retryAllFailed(); return; }
      if (al.dataset.alert === "resync") { al.disabled = true; sync(); return; }
    }
  });

  $("refresh").addEventListener("click", function () { sync(); });
  $("live").addEventListener("click", function () {
    state.live = !state.live;
    this.setAttribute("aria-pressed", String(state.live));
    $("livetx").textContent = state.live ? "Live" : "Paused";
    if (state.live) sync(); else clearTimeout(timer);
  });
  $("dclose").addEventListener("click", closeDrawer);
  $("scrim").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && state.drawerId) closeDrawer();
  });
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && state.live) sync();
  });

  /* ---------------- boot ---------------- */
  if (!api || typeof api.listJobs !== "function") {
    alerts.innerHTML = '<div class="alert"><span style="color:#ff5d54">' + ico("alert", 17) +
      '</span><span class="txt"><b>Queue service unavailable.</b> The admin API did not load.</span></div>';
    return;
  }
  renderUp();
  render();
  sync();
})();
</script>
</body>
</html>
