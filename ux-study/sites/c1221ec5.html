<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e13; --panel:#111823; --panel2:#0e141d; --line:#1e2836; --line2:#28374a;
    --text:#e7eef7; --muted:#8195ab; --dim:#5d7086;
    --queued:#8aa0b8; --running:#3d9bff; --succeeded:#2fbf82; --failed:#ff5f57; --warn:#f2a93b;
    --accent:#3d9bff;
    --radius:10px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 400px at 80% -120px, rgba(61,155,255,.10), transparent 70%),
      var(--bg);
    color:var(--text);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .shell{max-width:1160px;margin:0 auto;padding:0 20px 64px}

  header.top{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:18px 0 14px;border-bottom:1px solid var(--line);margin-bottom:18px;
  }
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{font-size:19px;font-weight:650;letter-spacing:-.01em;margin:0}
  .tag{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line2);border-radius:5px;padding:2px 6px}
  .live{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--succeeded);box-shadow:0 0 0 0 rgba(47,191,130,.55);animation:pulse 2.4s infinite}
  .live.paused .dot{background:var(--warn);animation:none}
  .live.down .dot{background:var(--failed);animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,191,130,.5)}70%{box-shadow:0 0 0 7px rgba(47,191,130,0)}100%{box-shadow:0 0 0 0 rgba(47,191,130,0)}}

  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;position:relative;overflow:hidden}
  .tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
  .tile .tl{display:flex;align-items:center;gap:7px;color:var(--c);font-size:12.5px;font-weight:600}
  .tile .tnum{font-size:30px;font-weight:650;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
  .t-failed{--c:var(--failed)} .t-running{--c:var(--running)} .t-queued{--c:var(--queued)} .t-succeeded{--c:var(--succeeded)}
  .tile.is-zero .tnum{color:var(--dim)}
  .tile.t-failed.has{box-shadow:inset 0 0 0 1px rgba(255,95,87,.35)}

  .stackwrap{display:flex;align-items:center;gap:12px;margin:12px 0 18px}
  .stack{flex:1;height:8px;border-radius:999px;overflow:hidden;display:flex;background:#16202c;border:1px solid var(--line)}
  .stack i{display:block;height:100%;transition:width .4s ease}
  .stack .sf{background:var(--failed)} .stack .sr{background:var(--running)} .stack .sq{background:var(--queued)} .stack .ss{background:var(--succeeded)}
  .total{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .grow{flex:1}
  .btn{
    display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;
    background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:8px;
    font:inherit;font-size:13px;font-weight:550;cursor:pointer;white-space:nowrap;
  }
  .btn:hover:not(:disabled){background:#182231;border-color:#35485f}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn:focus-visible,.seg button:focus-visible,.swt:focus-visible,.linkid:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn.primary{background:rgba(255,95,87,.14);border-color:rgba(255,95,87,.45);color:#ffb3ae}
  .btn.primary:hover:not(:disabled){background:rgba(255,95,87,.22)}
  .btn.tiny{height:24px;padding:0 8px;font-size:12px}
  .btn .cnt{font-variant-numeric:tabular-nums;background:rgba(255,255,255,.1);border-radius:999px;padding:0 6px;font-size:11.5px;line-height:17px}
  .swt{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px 0 8px;background:transparent;border:1px solid var(--line);border-radius:8px;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
  .swt .track{width:30px;height:17px;border-radius:999px;background:#25313f;position:relative;transition:background .18s}
  .swt .track::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#7d8fa3;transition:transform .18s,background .18s}
  .swt[aria-checked="true"]{color:var(--text)}
  .swt[aria-checked="true"] .track{background:rgba(61,155,255,.35)}
  .swt[aria-checked="true"] .track::after{transform:translateX(13px);background:var(--running)}
  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px}
  .seg button{height:26px;padding:0 10px;background:transparent;border:0;border-radius:6px;color:var(--muted);font:inherit;font-size:12.5px;font-weight:550;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .seg button[aria-pressed="true"]{background:#1d2836;color:var(--text)}
  .seg .n{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
  .seg button[aria-pressed="true"] .n{color:var(--muted)}
  .search{position:relative;display:flex;align-items:center}
  .search svg{position:absolute;left:9px;color:var(--dim);pointer-events:none}
  .search input{height:32px;width:170px;padding:0 10px 0 28px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);font:inherit;font-size:13px}
  .search input::placeholder{color:var(--dim)}

  .banner{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;margin-bottom:12px;font-size:13px;
    background:rgba(255,95,87,.1);border:1px solid rgba(255,95,87,.35);color:#ffb3ae}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  table{width:100%;border-collapse:collapse}
  thead th{
    text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);
    font-weight:600;padding:9px 14px;background:var(--panel2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2
  }
  tbody.jrow tr.main td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody.jrow:hover tr.main td{background:#141d29}
  tbody.jrow tr.errrow td{padding:0 14px 10px;border-bottom:1px solid var(--line)}
  .c-st{width:126px} .c-id{width:198px} .c-pg{width:178px} .c-ac{width:180px;text-align:right}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;
    color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);border:1px solid color-mix(in srgb,var(--c) 34%,transparent)}
  .s-queued{--c:var(--queued)} .s-running{--c:var(--running)} .s-succeeded{--c:var(--succeeded)} .s-failed{--c:var(--failed)}
  .linkid{background:none;border:0;padding:0;color:var(--text);font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12.5px;cursor:pointer;border-bottom:1px dashed var(--line2)}
  .linkid:hover{color:var(--accent);border-color:var(--accent)}
  .chip{display:inline-flex;align-items:center;gap:4px;margin-left:8px;padding:1px 6px;border-radius:5px;font-size:11px;font-weight:600}
  .chip.warn{color:var(--warn);background:rgba(242,169,59,.13);border:1px solid rgba(242,169,59,.34)}
  .pgwrap{display:flex;align-items:center;gap:8px}
  progress{-webkit-appearance:none;appearance:none;flex:1;height:6px;border:0;border-radius:999px;background:#1b2531;overflow:hidden}
  progress::-webkit-progress-bar{background:#1b2531;border-radius:999px}
  progress::-webkit-progress-value{background:var(--c,var(--running));border-radius:999px}
  progress.idle::-webkit-progress-value{background:var(--queued)}
  .pct{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;width:36px;text-align:right}
  .c-dt{color:var(--muted);font-size:12.5px}
  .err{display:inline-flex;align-items:flex-start;gap:6px;color:#ff9a95}
  .err svg{flex:none;margin-top:2px}
  .ok{display:inline-flex;align-items:center;gap:10px}
  a.dl{display:inline-flex;align-items:center;gap:5px;color:var(--accent);text-decoration:none;font-weight:550}
  a.dl:hover{text-decoration:underline}
  .acts{display:inline-flex;gap:6px;justify-content:flex-end}
  .rowerr{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;font-size:12.5px;
    background:rgba(255,95,87,.09);border:1px solid rgba(255,95,87,.3);color:#ffb3ae}
  .spin{animation:rot 1s linear infinite;transform-origin:50% 50%}
  @keyframes rot{to{transform:rotate(360deg)}}

  .skel td{padding:12px 14px;border-bottom:1px solid var(--line)}
  .sk{height:10px;border-radius:999px;background:linear-gradient(90deg,#17202c,#1e2a38,#17202c);background-size:200% 100%;animation:sh 1.3s linear infinite}
  @keyframes sh{to{background-position:-200% 0}}
  .empty{padding:44px 20px;text-align:center;color:var(--muted)}
  .empty .big{color:var(--text);font-weight:600;font-size:15px;margin:10px 0 4px}
  .empty svg{color:var(--dim)}

  aside.drawer{position:fixed;top:0;right:0;height:100%;width:400px;max-width:92vw;background:var(--panel);
    border-left:1px solid var(--line2);box-shadow:-24px 0 60px rgba(0,0,0,.5);transform:translateX(102%);
    transition:transform .22s ease;z-index:40;display:flex;flex-direction:column}
  aside.drawer.open{transform:none}
  .dhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .dhead h2{margin:0;font-size:14px;font-weight:650}
  .iconbtn{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--line2);border-radius:7px;color:var(--muted);cursor:pointer}
  .iconbtn:hover{color:var(--text);background:#182231}
  .dbody{padding:16px;overflow:auto;flex:1}
  .kv{display:grid;grid-template-columns:112px 1fr;gap:8px 12px;font-size:13px;margin:0}
  .kv dt{color:var(--dim);font-size:12px}
  .kv dd{margin:0}
  .dbox{padding:10px 12px;border-radius:8px;font-size:12.5px;margin-bottom:14px}
  .dbox.bad{background:rgba(255,95,87,.09);border:1px solid rgba(255,95,87,.3);color:#ffb3ae}
  .dbox.good{background:rgba(47,191,130,.09);border:1px solid rgba(47,191,130,.3);color:#9ce6c4}
  .dbox h3{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.75}
  .dfoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
  .scrim{position:fixed;inset:0;background:rgba(5,8,12,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
  .scrim.on{opacity:1;pointer-events:auto}

  dialog{border:1px solid var(--line2);background:var(--panel);color:var(--text);border-radius:12px;padding:0;width:440px;max-width:92vw;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  dialog::backdrop{background:rgba(5,8,12,.6)}
  .dlg{padding:18px}
  .dlg h2{margin:0 0 6px;font-size:15px;font-weight:650}
  .dsub{margin:0 0 12px;color:var(--muted);font-size:12.5px}
  .blist{list-style:none;margin:0 0 12px;padding:8px;max-height:190px;overflow:auto;background:var(--panel2);border:1px solid var(--line);border-radius:8px}
  .blist li{display:flex;align-items:center;gap:8px;padding:4px;font-size:12.5px;font-family:"JetBrains Mono",ui-monospace,monospace}
  .blist li .st{margin-left:auto;font-family:Inter,sans-serif;font-size:11.5px;color:var(--dim);text-align:right}
  .blist li.ok,.blist li.ok .st{color:var(--succeeded)}
  .blist li.bad,.blist li.bad .st{color:var(--failed)}
  .blist li.run,.blist li.run .st{color:var(--running)}
  .bprog{display:flex;align-items:center;gap:9px;margin-bottom:14px}
  .dact{display:flex;gap:8px;justify-content:flex-end}

  .toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:330px}
  .toast{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:9px;font-size:12.5px;
    background:#16202c;border:1px solid var(--line2);box-shadow:0 12px 30px rgba(0,0,0,.45);animation:slide .18s ease}
  .toast.bad{border-color:rgba(255,95,87,.45);color:#ffb3ae}
  .toast.good{border-color:rgba(47,191,130,.4);color:#9ce6c4}
  .toast svg{flex:none;margin-top:1px}
  @keyframes slide{from{transform:translateY(8px);opacity:0}}

  @media (max-width:880px){
    .tiles{grid-template-columns:repeat(2,1fr)}
    .c-pg,.c-dt,thead th:nth-child(3),thead th:nth-child(4){display:none}
    .c-st{width:120px}.c-id{width:auto}.c-ac{width:auto}
    .search input{width:120px}
    .toolbar{gap:8px}
  }
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><h1>Job queue</h1><span class="tag">admin</span></div>
    <div class="live" id="live" role="status" aria-live="polite"><span class="dot"></span><span id="liveText">Loading queue</span></div>
  </header>

  <h2 class="sr-only">Queue summary</h2>
  <section class="tiles" id="tiles"></section>
  <div class="stackwrap">
    <div class="stack" id="stack" role="img" aria-label="Queue composition"></div>
    <span class="total" id="total"></span>
  </div>

  <div class="toolbar">
    <button class="btn primary" id="retryAll" type="button" disabled>
      <span id="retryAllIco"></span><span id="retryAllLbl">Retry all failed</span><span class="cnt" id="retryAllCnt">0</span>
    </button>
    <button class="btn" id="refresh" type="button"><span id="refreshIco"></span><span>Refresh</span></button>
    <button class="swt" id="auto" type="button" role="switch" aria-checked="true"><span class="track"></span><span>Auto-refresh</span></button>
    <span class="grow"></span>
    <div class="seg" id="filters" role="group" aria-label="Filter by status"></div>
    <label class="search"><span class="sr-only">Filter by job ID</span><input id="q" type="search" placeholder="Job ID" autocomplete="off"></label>
  </div>

  <div id="bannerSlot"></div>

  <div class="panel">
    <table>
      <thead><tr><th>Status</th><th>Job</th><th>Progress</th><th>Detail</th><th style="text-align:right">Action</th></tr></thead>
      <tbody id="skel"></tbody>
      <tbody id="emptyBody" hidden><tr><td colspan="5"><div class="empty" id="emptyBox"></div></td></tr></tbody>
    </table>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Job detail">
  <div class="dhead"><h2 id="dTitle" class="mono">job</h2><button class="iconbtn" id="dClose" type="button" aria-label="Close detail"></button></div>
  <div class="dbody" id="dBody"></div>
  <div class="dfoot" id="dFoot"></div>
</aside>

<dialog id="bulk" aria-labelledby="bulkTitle">
  <div class="dlg">
    <h2 id="bulkTitle">Retry failed jobs</h2>
    <p class="dsub" id="bulkSub"></p>
    <ul class="blist" id="bulkList"></ul>
    <div class="bprog" id="bulkProgWrap" hidden><progress id="bulkProg" max="1" value="0"></progress><span class="pct" id="bulkPct"></span></div>
    <div class="dact">
      <button class="btn" id="bulkClose" type="button">Cancel</button>
      <button class="btn primary" id="bulkGo" type="button">Retry</button>
    </div>
  </div>
</dialog>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";
  var api = window.api;
  var POLL_MS = 2000, DETAIL_MS = 1500, STALL_MS = 30000;
  var RANK = { failed:0, running:1, queued:2, succeeded:3 };
  var LABEL = { queued:"Queued", running:"Running", succeeded:"Succeeded", failed:"Failed" };

  var I = {
    clock:'<circle cx="8" cy="8" r="6.1" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.5V8l2.3 1.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>',
    run:'<circle cx="8" cy="8" r="6.1" fill="none" stroke="currentColor" stroke-opacity=".28" stroke-width="1.7"/><path d="M14.1 8A6.1 6.1 0 0 0 8 1.9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>',
    check:'<circle cx="8" cy="8" r="6.1" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m5.1 8.2 2 2.1 3.8-4.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>',
    alert:'<path d="M8 2.1 14.8 13.6H1.2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 6.3v3.1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="8" cy="11.5" r=".95" fill="currentColor"/>',
    refresh:'<path d="M13.3 7.2A5.4 5.4 0 1 0 12.8 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M13.6 3.2v4h-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
    down:'<path d="M8 2.6v7.6M5 7.4 8 10.4l3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.8 12.6h10.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
    close:'<path d="m4.2 4.2 7.6 7.6M11.8 4.2l-7.6 7.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
    search:'<circle cx="7.2" cy="7.2" r="4.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.6 10.6 2.7 2.7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>',
    inbox:'<path d="M3 5.5 5 2.5h6l2 3v7a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M3 9.2h3l.9 1.6h2.2l.9-1.6h3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>',
    stop:'<rect x="4.4" y="4.4" width="7.2" height="7.2" rx="1.4" fill="currentColor"/>'
  };
  function ic(n, cls, size){
    return '<svg class="'+(cls||'')+'" width="'+(size||14)+'" height="'+(size||14)+'" viewBox="0 0 16 16" aria-hidden="true">'+I[n]+'</svg>';
  }
  function statusIcon(s){
    return s==='failed'?ic('alert'):s==='succeeded'?ic('check'):s==='running'?ic('run','spin'):ic('clock');
  }
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function fmt(n){ return Number(n).toLocaleString('en-US'); }
  function ago(ms){
    var s = Math.max(0, Math.round(ms/1000));
    if (s < 2) return 'just now';
    if (s < 60) return s + 's ago';
    var m = Math.floor(s/60);
    if (m < 60) return m + 'm ago';
    return Math.floor(m/60) + 'h ago';
  }
  function dur(ms){
    var s = Math.max(0, Math.round(ms/1000));
    return s < 60 ? s + 's' : Math.floor(s/60) + 'm ' + (s % 60) + 's';
  }
  function describe(e){
    if (!e) return 'Unknown error';
    if (e.name === 'AbortError') return 'Request stopped';
    if (e.code === 'NETWORK') return 'Network error \u2014 the queue server did not respond';
    if (e.code === 'NOT_FOUND') return 'This job is no longer in the queue';
    return e.message || String(e);
  }

  var state = {
    jobs: [], loaded:false, pollError:null,
    filter:'all', query:'',
    pending:new Map(), rowErr:new Map(), meta:new Map(),
    updatedAt:0, auto:true, inFlight:false, wait:POLL_MS,
    drawerId:null, drawerErr:null, bulk:null
  };

  function $(id){ return document.getElementById(id); }
  var elTiles=$('tiles'), elStack=$('stack'), elTotal=$('total'), elLive=$('live'), elLiveText=$('liveText'),
      elFilters=$('filters'), elQ=$('q'), elSkel=$('skel'), elEmptyBody=$('emptyBody'), elEmptyBox=$('emptyBox'),

        b.results.push({ id:id, ok:true });
      }, function(e){
        b.results.push({ id:id, ok:false, msg:describe(e) });
      }).then(function(){
        b.done++; i++; b.current = null;
        renderDialog();
        render();
        return step();
      });
    }
    step().then(function(){
      b.running = false;
      b.current = null;
      var bad = b.results.filter(function(r){ return !r.ok; }).length;
      var ok = b.results.length - bad;
      if (b.stop) toast('good', 'Stopped after ' + b.done + ' of ' + b.ids.length);
      else if (bad) toast('bad', ok + ' requeued, ' + bad + ' failed');
      else if (ok) toast('good', ok + (ok === 1 ? ' job requeued' : ' jobs requeued'));
      renderDialog();
      render();
      if (state.auto) poll(false);
    });
  }

  function renderDialog(){
    var b = state.bulk;
    if (!b) return;
    var n = b.ids.length;
    var sub;
    if (b.running) sub = 'Retrying ' + Math.min(b.done + 1, n) + ' of ' + n + '. Each job restarts from the beginning.';
    else if (b.results.length && b.done >= n) sub = b.results.filter(function(r){ return r.ok; }).length + ' of ' + n + ' requeued.';
    else if (b.results.length) sub = 'Stopped after ' + b.done + ' of ' + n + '.';
    else sub = 'Requeues ' + n + (n === 1 ? ' job' : ' jobs') + '. Each job restarts from the beginning.';
    if (elBulkSub.textContent !== sub) elBulkSub.textContent = sub;

    var html = b.ids.map(function(id){
      var res = null;
      for (var k = 0; k < b.results.length; k++) if (b.results[k].id === id) res = b.results[k];
      var cls = res ? (res.ok ? 'ok' : 'bad') : (b.current === id ? 'run' : '');
      var st = res ? (res.ok ? 'Requeued' : esc(res.msg)) : (b.current === id ? 'Retrying\u2026' : 'Waiting');
      var glyph = res ? (res.ok ? ic('check') : ic('alert')) : (b.current === id ? ic('run','spin') : ic('clock'));
      return '<li class="'+cls+'">'+glyph+'<span>'+esc(id)+'</span><span class="st">'+st+'</span></li>';
    }).join('');
    if (elBulkList.dataset.sig !== html) { elBulkList.innerHTML = html; elBulkList.dataset.sig = html; }

    elBulkProgWrap.hidden = !(b.running || b.results.length);
    elBulkProg.max = n;
    elBulkProg.value = b.done;
    var pctTxt = b.done + '/' + n;
    if (elBulkPct.textContent !== pctTxt) elBulkPct.textContent = pctTxt;

    var go, close;
    if (b.running) {
      go = b.stop ? ic('run','spin')+'<span>Stopping</span>' : ic('stop')+'<span>Stop</span>';
      elBulkGo.disabled = b.stop;
      close = 'Close';
    } else if (b.results.length) {
      var left = remainingIds(b).length;
      go = left ? '<span>Retry remaining</span><span class="cnt">'+left+'</span>' : '<span>Done</span>';
      elBulkGo.disabled = false;
      close = 'Close';
    } else {
      go = '<span>Retry '+n+(n === 1 ? ' job' : ' jobs')+'</span>';
      elBulkGo.disabled = false;
      close = 'Cancel';
    }
    if (elBulkGo.dataset.sig !== go) { elBulkGo.innerHTML = go; elBulkGo.dataset.sig = go; }
    if (elBulkClose.textContent !== close) elBulkClose.textContent = close;
  }

  function toast(kind, text){
    var el = document.createElement('div');
    el.className = 'toast ' + kind;
    el.innerHTML = (kind === 'bad' ? ic('alert') : ic('check')) + '<span>' + esc(text) + '</span>';
    elToasts.appendChild(el);
    setTimeout(function(){ el.remove(); }, kind === 'bad' ? 7000 : 4000);
  }

  setInterval(function(){
    renderLive();
    if (state.loaded) { renderTable(); renderDrawer(); }
  }, 1000);

  if (!api) {
    elSkel.style.display = 'none';
    elBanner.dataset.sig = 'noapi';
    elBanner.innerHTML = '<div class="banner">'+ic('alert')+'<span class="grow">Queue API unavailable on this page.</span></div>';
  } else {
    render();
    poll(false);
  }
})();
</script>
</body>
</html>
