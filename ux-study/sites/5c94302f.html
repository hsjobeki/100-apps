<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout &middot; Salt &amp; Thistle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f2ea;
    --surface:#fffdf8;
    --ink:#1d1a15;
    --muted:#6d6456;
    --line:#e3dccd;
    --line-strong:#cdc3ae;
    --accent:#1f5d4c;
    --accent-soft:#e6efea;
    --danger:#a33122;
    --danger-soft:#fbeae6;
    --ok:#2c6e49;
    --radius:10px;
    --shadow:0 1px 2px rgba(29,26,21,.05), 0 8px 24px -16px rgba(29,26,21,.35);
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:15px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  svg{display:block}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    max-width:1060px;margin:0 auto;padding:22px 24px 6px;
  }
  .wordmark{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:22px;letter-spacing:-.01em;margin:0}
  .secure{display:flex;align-items:center;gap:6px;margin:0;color:var(--muted);font-size:12.5px}
  .secure svg{width:13px;height:13px}

  /* ---------- layout ---------- */
  .wrap{max-width:1060px;margin:0 auto;padding:12px 24px 64px;display:grid;gap:36px;grid-template-columns:minmax(0,1fr) 340px;align-items:start}
  @media (max-width:900px){
    .wrap{grid-template-columns:1fr;gap:20px;padding-bottom:40px}
    .col-form{order:2}
    .col-cart{order:1}
  }
  h1.page{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:28px;margin:6px 0 18px;letter-spacing:-.015em}

  /* ---------- progress ---------- */
  .progress-row{display:flex;align-items:center;gap:12px;margin:0 0 22px}
  progress{appearance:none;-webkit-appearance:none;flex:1;height:6px;border:0;border-radius:999px;background:var(--line);overflow:hidden}
  progress::-webkit-progress-bar{background:var(--line);border-radius:999px}
  progress::-webkit-progress-value{background:var(--accent);border-radius:999px;transition:width .25s ease}
  .progress-text{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:78px;text-align:right}

  /* ---------- sections ---------- */
  fieldset{border:0;margin:0;padding:0;min-width:0}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px 20px 22px;margin-bottom:16px;box-shadow:var(--shadow);
  }
  .card h2{display:flex;align-items:center;gap:10px;margin:0 0 16px;font-size:15px;font-weight:600;letter-spacing:.01em}
  .step{
    position:relative;flex:none;width:22px;height:22px;border-radius:50%;
    border:1px solid var(--line-strong);color:var(--muted);
    font-family:Fraunces,Georgia,serif;font-size:12px;
    display:grid;place-items:center;transition:background .2s,border-color .2s
  }
  .step .tick{width:12px;height:12px;position:absolute;opacity:0;transform:scale(.6);transition:opacity .18s,transform .18s;color:#fff}
  .card.done .step{background:var(--accent);border-color:var(--accent)}
  .card.done .step .num{opacity:0}
  .card.done .step .tick{opacity:1;transform:scale(1)}

  /* ---------- fields ---------- */
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:1fr 1fr}
  .g-cc{grid-template-columns:1fr 92px 92px}
  @media (max-width:520px){.g2,.g-cc{grid-template-columns:1fr}}
  .field{min-width:0}
  .field label{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin:0 0 5px}
  .control{position:relative;display:block}
  input,select{
    width:100%;height:44px;padding:0 38px 0 12px;
    background:#fff;color:var(--ink);
    border:1px solid var(--line-strong);border-radius:8px;
    font:inherit;font-size:15px;
    transition:border-color .15s,box-shadow .15s,background .15s;
  }
  input::placeholder{color:#b3aa98}
  select{padding-right:58px;appearance:none;-webkit-appearance:none;cursor:pointer}
  .control.sel::after{
    content:"";position:absolute;right:15px;top:50%;width:7px;height:7px;margin-top:-5px;
    border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);pointer-events:none
  }
  .control.sel .state{right:34px}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  input:disabled,select:disabled{background:#f4f1ea;color:#8d8475;cursor:not-allowed}
  .field.invalid input,.field.invalid select{border-color:var(--danger);background:var(--danger-soft)}
  .field.invalid input:focus,.field.invalid select:focus{box-shadow:0 0 0 3px #f6d9d2}
  .state{position:absolute;right:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;pointer-events:none}
  .state svg{width:17px;height:17px}
  .state .ok-i{color:var(--ok)}
  .state .bad-i{color:var(--danger)}
  .err{display:flex;align-items:flex-start;gap:5px;margin:6px 0 0;font-size:12.5px;color:var(--danger)}
  .err svg{flex:none;width:13px;height:13px;margin-top:2px}
  .hint{margin:6px 0 0;font-size:12px;color:var(--muted)}
  .brand{position:absolute;right:38px;top:50%;transform:translateY(-50%);pointer-events:none;opacity:0;transition:opacity .2s}
  .brand.on{opacity:1}
  .brand svg{width:30px;height:19px}
  .field.loading .control::after{
    content:"";position:absolute;inset:0;border-radius:8px;pointer-events:none;
    background:linear-gradient(100deg,#f1ece2 8%,#faf7f1 24%,#f1ece2 40%);
    background-size:300% 100%;animation:sweep 1.1s linear infinite;
  }
  @keyframes sweep{from{background-position:140% 0}to{background-position:-40% 0}}

  /* ---------- submit ---------- */
  .banner{display:flex;gap:9px;align-items:flex-start;padding:12px 14px;border-radius:9px;margin:0 0 14px;font-size:13.5px;border:1px solid}
  .banner.bad{background:var(--danger-soft);border-color:#eec7bd;color:var(--danger)}
  .banner.info{background:#f1eee6;border-color:var(--line);color:var(--muted)}
  .banner svg{flex:none;width:16px;height:16px;margin-top:1px}
  .banner p{margin:0}
  .linkbtn{
    display:inline-block;margin-top:6px;padding:0;border:0;background:none;
    font:inherit;font-size:13.5px;font-weight:600;color:inherit;
    text-decoration:underline;text-underline-offset:3px;cursor:pointer
  }
  .actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .place{
    position:relative;flex:1;min-width:220px;height:50px;
    display:inline-flex;align-items:center;justify-content:center;gap:9px;
    background:var(--accent);color:#fff;border:0;border-radius:9px;
    font:inherit;font-size:15px;font-weight:600;cursor:pointer;
    transition:background .15s,transform .05s;
  }
  .place:hover:not(:disabled){background:#194c3e}
  .place:active:not(:disabled){transform:translateY(1px)}
  .place:focus-visible{outline:3px solid #a8c9be;outline-offset:2px}
  .place:disabled{cursor:not-allowed;opacity:.72}
  .place .lbl-busy{display:none}
  .place.busy .lbl-idle{display:none}
  .place.busy .lbl-busy{display:inline}
  .place .spin{display:none;width:17px;height:17px;animation:rot .9s linear infinite}
  .place.busy .spin{display:block}
  @keyframes rot{to{transform:rotate(360deg)}}
  .cancel{
    padding:9px 12px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;
    font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer
  }
  .cancel:hover{border-color:var(--ink)}
  .slow{margin:10px 0 0;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .slow svg{width:13px;height:13px;flex:none}

  /* ---------- cart ---------- */
  .cart{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;position:sticky;top:20px
  }
  @media (max-width:900px){.cart{position:static}}
  .cart > summary{
    list-style:none;cursor:pointer;padding:14px 18px;
    display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600
  }
  .cart > summary::-webkit-details-marker{display:none}
  .cart > summary .chev{width:12px;height:12px;color:var(--muted);transition:transform .2s}
  .cart[open] > summary .chev{transform:rotate(180deg)}
  .cart > summary .sum-total{margin-left:auto;font-variant-numeric:tabular-nums}
  @media (min-width:901px){
    .cart > summary{cursor:default;border-bottom:1px solid var(--line)}
    .cart > summary .chev{display:none}
  }
  .cart-body{padding:6px 18px 18px}
  .line{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}
  .tile{width:44px;height:44px;border-radius:7px;overflow:hidden}
  .tile svg{width:44px;height:44px}
  .line .nm{font-size:13.5px;font-weight:500;margin:0}
  .line .vr{font-size:12px;color:var(--muted);margin:1px 0 0}
  .line .amt{font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .qty{display:inline-flex;align-items:center;margin-top:7px;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden;vertical-align:middle}
  .qty button{width:26px;height:26px;border:0;background:#fff;color:var(--ink);cursor:pointer;display:grid;place-items:center;font:inherit}
  .qty button:hover:not(:disabled){background:var(--accent-soft)}
  .qty button:disabled{color:#c2b9a7;cursor:not-allowed}
  .qty svg{width:10px;height:10px}
  .qty .n{min-width:26px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums;border-left:1px solid var(--line-strong);border-right:1px solid var(--line-strong);height:26px;line-height:26px}
  .rm{margin:7px 0 0 8px;border:0;background:none;padding:0;color:var(--muted);font:inherit;font-size:12px;text-decoration:underline;text-underline-offset:2px;cursor:pointer;vertical-align:middle}
  .rm:hover:not(:disabled){color:var(--danger)}
  .rm:disabled{opacity:.5;cursor:not-allowed}
  .totals{margin-top:14px;display:grid;gap:8px}
  .totals div{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .totals .grand{padding-top:10px;border-top:1px solid var(--line);color:var(--ink);font-size:17px;font-weight:600}
  .totals .grand span:first-child{font-family:Fraunces,Georgia,serif;font-weight:500}
  .empty{padding:22px 0 8px;text-align:center;color:var(--muted);font-size:13.5px}

  /* ---------- confirmation ---------- */
  .done-wrap{max-width:460px;margin:0 auto;padding:52px 24px 80px;text-align:center}
  .done-mark{width:62px;height:62px;margin:0 auto 18px;color:var(--accent)}
  .done-wrap h1{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:29px;margin:0 0 22px;letter-spacing:-.015em;outline:none}
  .receipt{
    text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;display:grid;gap:11px;box-shadow:var(--shadow);margin:0
  }
  .receipt div{display:flex;justify-content:space-between;gap:16px;font-size:13.5px}
  .receipt dt{color:var(--muted);margin:0}
  .receipt dd{margin:0;font-variant-numeric:tabular-nums;text-align:right}
  .again{
    margin-top:22px;padding:11px 18px;border:1px solid var(--line-strong);background:var(--surface);
    border-radius:8px;font:inherit;font-size:14px;font-weight:500;cursor:pointer
  }
  .again:hover{border-color:var(--ink)}
</style>
</head>
<body>

<header class="topbar">
  <p class="wordmark">Salt &amp; Thistle</p>
  <p class="secure">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.6"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>
    Secure checkout
  </p>
</header>

<main class="wrap" id="main">
  <div class="col-form">
    <h1 class="page">Checkout</h1>

    <div class="progress-row">
      <progress id="prog" max="9" value="0" aria-labelledby="progText"></progress>
      <span class="progress-text" id="progText">0 of 9 filled</span>
    </div>

    <form id="checkout" novalidate autocomplete="on">
      <fieldset id="allFields">
        <section class="card" id="sec-contact">
          <h2><span class="step"><span class="num">1</span><svg class="tick" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.4l3 3 6-6.6"/></svg></span> Contact</h2>
          <div class="grid">
            <div class="field" data-field="email">
              <label for="email">Email</label>
              <span class="control"><input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com" aria-describedby="err-email"><span class="state"></span></span>
              <p class="err" id="err-email" role="alert" hidden></p>
              <p class="hint" id="hint-email" hidden>From your account</p>
            </div>
          </div>
        </section>

        <section class="card" id="sec-ship">
          <h2><span class="step"><span class="num">2</span><svg class="tick" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.4l3 3 6-6.6"/></svg></span> Shipping address</h2>
          <div class="grid">
            <div class="field" data-field="name">
              <label for="name">Full name</label>
              <span class="control"><input id="name" name="name" type="text" autocomplete="name" aria-describedby="err-name"><span class="state"></span></span>
              <p class="err" id="err-name" role="alert" hidden></p>
            </div>
            <div class="field" data-field="address1">
              <label for="address1">Street address</label>
              <span class="control"><input id="address1" name="address1" type="text" autocomplete="address-line1" aria-describedby="err-address1"><span class="state"></span></span>
              <p class="err" id="err-address1" role="alert" hidden></p>
            </div>
            <div class="grid g2">
              <div class="field" data-field="city">
                <label for="city">City</label>
                <span class="control"><input id="city" name="city" type="text" autocomplete="address-level2" aria-describedby="err-city"><span class="state"></span></span>
                <p class="err" id="err-city" role="alert" hidden></p>
              </div>
              <div class="field" data-field="postalCode">
                <label for="postalCode" id="lbl-postal">Postal code</label>
                <span class="control"><input id="postalCode" name="postalCode" type="text" autocomplete="postal-code" aria-describedby="err-postalCode"><span class="state"></span></span>
                <p class="err" id="err-postalCode" role="alert" hidden></p>
              </div>
            </div>
            <div class="field" data-field="country">
              <label for="country">Country</label>
              <span class="control sel">
                <select id="country" name="country" autocomplete="country" aria-describedby="err-country">
                  <option value="" selected>Choose a country</option>
                  <option value="US">United States</option>
                  <option value="CA">Canada</option>
                  <option value="GB">United Kingdom</option>
                  <option value="IE">Ireland</option>
                  <option value="DE">Germany</option>
                  <option value="FR">France</option>
                  <option value="NL">Netherlands</option>
                  <option value="ES">Spain</option>
                  <option value="AU">Australia</option>
                  <option value="NZ">New Zealand</option>
                  <option value="JP">Japan</option>
                </select>
                <span class="state"></span>
              </span>
              <p class="err" id="err-country" role="alert" hidden></p>
            </div>
          </div>
        </section>

        <section class="card" id="sec-pay">
          <h2><span class="step"><span class="num">3</span><svg class="tick" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.4l3 3 6-6.6"/></svg></span> Payment</h2>
          <div class="grid g-cc">
            <div class="field" data-field="cardNumber">
              <label for="cardNumber">Card number</label>
              <span class="control">
                <input id="cardNumber" name="cardNumber" type="text" inputmode="numeric" autocomplete="cc-number" placeholder="1234 5678 9012 3456" maxlength="23" aria-describedby="err-cardNumber">
                <span class="brand" id="brand" aria-hidden="true"></span>
                <span class="state"></span>
              </span>
              <p class="err" id="err-cardNumber" role="alert" hidden></p>
            </div>
            <div class="field" data-field="cardExpiry">
              <label for="cardExpiry">Expiry</label>
              <span class="control"><input id="cardExpiry" name="cardExpiry" type="text" inputmode="numeric" autocomplete="cc-exp" placeholder="MM/YY" maxlength="5" aria-describedby="err-cardExpiry"><span class="state"></span></span>
              <p class="err" id="err-cardExpiry" role="alert" hidden></p>
            </div>
            <div class="field" data-field="cardCvc">
              <label for="cardCvc" id="lbl-cvc">CVC</label>
              <span class="control"><input id="cardCvc" name="cardCvc" type="text" inputmode="numeric" autocomplete="cc-csc" placeholder="123" maxlength="4" aria-describedby="err-cardCvc"><span class="state"></span></span>
              <p class="err" id="err-cardCvc" role="alert" hidden></p>
            </div>
          </div>
        </section>
      </fieldset>

      <div class="submit-zone">
        <div class="banner bad" id="formError" hidden aria-live="polite">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 2.6L14.6 13.4H1.4z" stroke-linejoin="round"/><path d="M8 6.6v3.1" stroke-linecap="round"/><circle cx="8" cy="11.6" r=".75" fill="currentColor" stroke="none"/></svg>
          <div>
            <p id="formErrorMsg"></p>
            <button type="button" class="linkbtn" id="retry" hidden>Try again</button>
          </div>
        </div>

        <div class="actions">
          <button type="submit" class="place" id="place">
            <svg class="spin" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.2" stroke="rgba(255,255,255,.35)" stroke-width="2"/><path d="M14.2 8A6.2 6.2 0 0 0 8 1.8" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
            <span class="lbl-idle">Pay <span id="btnTotal">&mdash;</span></span>
            <span class="lbl-busy">Placing order&hellip;</span>
          </button>
          <button type="button" class="cancel" id="cancel" hidden>Cancel</button>
        </div>

        <p class="slow" id="slowNote" hidden>
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M8 4.6V8l2.3 1.6" stroke-linecap="round"/></svg>
          Still waiting on the payment provider.
        </p>
      </div>
    </form>
  </div>

  <div class="col-cart">
    <details class="cart" id="cart" open>
      <summary>
        Order
        <span class="sum-total" id="sumTotal">&mdash;</span>
        <svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6l4.5 4.5L12.5 6"/></svg>
      </summary>
      <div class="cart-body">
        <div id="lines"></div>
        <div class="totals" id="totals" hidden>
          <div><span>Subtotal</span><span id="tSub">&mdash;</span></div>
          <div><span>Shipping</span><span id="tShip">&mdash;</span></div>
          <div class="grand"><span>Total</span><span id="tGrand">&mdash;</span></div>
        </div>
      </div>
    </details>
  </div>
</main>

<section class="done-wrap" id="confirmation" hidden>
  <svg class="done-mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
    <circle cx="32" cy="32" r="29" stroke="currentColor" stroke-width="2.5" opacity=".28"/>
    <circle cx="32" cy="32" r="22" fill="currentColor" opacity=".1"/>
    <path d="M21 32.6l7.6 7.6L43.5 25" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1 id="doneTitle" tabindex="-1">Order placed</h1>
  <dl class="receipt">
    <div><dt>Order</dt><dd id="confId"></dd></div>
    <div><dt>Email</dt><dd id="confEmail"></dd></div>
    <div><dt>Items</dt><dd id="confItems"></dd></div>
    <div><dt>Charged</dt><dd id="confTotal"></dd></div>
    <div><dt>Ships to</dt><dd id="confShip"></dd></div>
  </dl>
  <button type="button" class="again" id="startOver">New order</button>
</section>

<p class="sr" id="live" role="status" aria-live="polite"></p>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var api = window.api || null;

  /* ---------------- basket (client-side cart state) ---------------- */

  var CATALOG = [
    { id: "sku_salt",    name: "Sea salt flakes",   variant: "250 g tin",     unit: 900,  glyph: "S", tint: "#e6efea" },
    { id: "sku_skillet", name: "Cast-iron skillet", variant: "26 cm",         unit: 6800, glyph: "K", tint: "#efe8dc" },
    { id: "sku_towel",   name: "Linen tea towel",   variant: "Natural, pair", unit: 1800, glyph: "T", tint: "#e9ece6" }
  ];
  var START_QTY = { sku_salt: 2, sku_skillet: 1, sku_towel: 1 };
  var cart = [];
  function resetCart() {
    cart = CATALOG.map(function (p) {
      return { id: p.id, name: p.name, variant: p.variant, unit: p.unit, glyph: p.glyph, tint: p.tint, qty: START_QTY[p.id] };
    });
  }
  resetCart();

  var money = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
  function fmt(cents) { return money.format(cents / 100); }

  var SHIP = { US: 600, CA: 1200, GB: 1400, IE: 1400, DE: 1400, FR: 1400, NL: 1400, ES: 1400, AU: 2200, NZ: 2200, JP: 2200 };
  function subtotal() { return cart.reduce(function (s, i) { return s + i.unit * i.qty; }, 0); }
  function shipping() { var c = $("country").value; return c && SHIP[c] != null ? SHIP[c] : null; }
  function grand() { var s = shipping(); return s == null ? null : subtotal() + s; }

  /* ---------------- fields ---------------- */

  var POSTAL_LABEL = { US: "ZIP code", GB: "Postcode", AU: "Postcode", NZ: "Postcode", IE: "Eircode" };
  var KEYS = ["email", "name", "address1", "city", "postalCode", "country", "cardNumber", "cardExpiry", "cardCvc"];

  function digits(s) { return (s || "").replace(/\D/g, ""); }

  function brandOf(num) {
    var d = digits(num);
    if (/^4/.test(d)) return "visa";
    if (/^(5[1-5]|2[2-7])/.test(d)) return "mastercard";
    if (/^3[47]/.test(d)) return "amex";
    if (/^(6011|65)/.test(d)) return "discover";
    return null;
  }
  function luhn(d) {
    var sum = 0, alt = false;
    for (var i = d.length - 1; i >= 0; i--) {
      var n = d.charCodeAt(i) - 48;
      if (alt) { n *= 2; if (n > 9) n -= 9; }
      sum += n; alt = !alt;
    }
    return d.length > 0 && sum % 10 === 0;
  }

  var RULES = {
    email: function (v) {
      if (!v) return "Enter an email address";
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) return "Use a format like name@example.com";
      return null;
    },
    name: function (v) { return v.length >= 2 ? null : "Enter the name for delivery"; },
    address1: function (v) { return v ? null : "Enter a street address"; },
    city: function (v) { return v ? null : "Enter a city"; },
    postalCode: function (v) {
      var c = $("country").value;
      if (!v) return "Enter a " + (POSTAL_LABEL[c] || "postal code").toLowerCase();
      if (c === "US" && !/^\d{5}(-\d{4})?$/.test(v)) return "Use 5 digits, like 94110";
      if (c === "CA" && !/^[A-Za-z]\d[A-Za-z][ -]?\d[A-Za-z]\d$/.test(v)) return "Use a format like M5V 2T6";
      if (v.length > 12) return "This looks too long";
      return null;
    },
    country: function (v) { return v ? null : "Choose a country"; },
    cardNumber: function (v) {
      var d = digits(v);
      if (!d) return "Enter a card number";
      var want = brandOf(d) === "amex" ? 15 : 16;
      if (d.length < want) return "Card numbers have " + want + " digits";
      if (!luhn(d)) return "This card number is not valid";
      return null;
    },
    cardExpiry: function (v) {
      var d = digits(v);
      if (!d) return "Enter the expiry date";
      if (d.length < 4) return "Use MM/YY";
      var m = parseInt(d.slice(0, 2), 10), y = 2000 + parseInt(d.slice(2, 4), 10);
      if (!(m >= 1 && m <= 12)) return "Months run 01 to 12";
      var now = new Date();
      if (y < now.getFullYear() || (y === now.getFullYear() && m < now.getMonth() + 1)) return "This card has expired";
      return null;
    },
    cardCvc: function (v) {
      var d = digits(v), want = brandOf($("cardNumber").value) === "amex" ? 4 : 3;
      if (!d) return want === 4 ? "Enter the 4 digits on the front" : "Enter the 3 digits on the back";
      if (d.length !== want) return "Use " + want + " digits";
      return null;
    }
  };

  var SECTIONS = [
    { el: "sec-contact", keys: ["email"] },
    { el: "sec-ship", keys: ["name", "address1", "city", "postalCode", "country"] },
    { el: "sec-pay", keys: ["cardNumber", "cardExpiry", "cardCvc"] }
  ];

  /* ---------------- icons ---------------- */

  var ICON_OK = '<svg class="ok-i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.4l3.2 3.2L13 4.6"/></svg>';
  var ICON_BAD = '<svg class="bad-i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="8" r="6.4"/><path d="M8 4.8v3.8" stroke-linecap="round"/><circle cx="8" cy="11.2" r=".8" fill="currentColor" stroke="none"/></svg>';

  var BRANDS = {
    visa: '<svg viewBox="0 0 32 20" aria-hidden="true"><rect width="32" height="20" rx="3" fill="#1a1f71"/><text x="16" y="13.6" text-anchor="middle" font-family="Instrument Sans, sans-serif" font-size="8" font-weight="600" fill="#fff" letter-spacing="1">VISA</text></svg>',
    mastercard: '<svg viewBox="0 0 32 20" aria-hidden="true"><rect width="32" height="20" rx="3" fill="#1d1a15"/><circle cx="13.4" cy="10" r="5.4" fill="#eb001b"/><circle cx="18.6" cy="10" r="5.4" fill="#f79e1b" fill-opacity=".85"/></svg>',
    amex: '<svg viewBox="0 0 32 20" aria-hidden="true"><rect width="32" height="20" rx="3" fill="#1f6fb2"/><text x="16" y="13.4" text-anchor="middle" font-family="Instrument Sans, sans-serif" font-size="7" font-weight="600" fill="#fff" letter-spacing=".6">AMEX</text></svg>',
    discover: '<svg viewBox="0 0 32 20" aria-hidden="true"><rect width="32" height="20" rx="3" fill="#f1f0ec" stroke="#cdc3ae"/><circle cx="23" cy="10" r="4.6" fill="#f26e21"/><text x="11" y="13" text-anchor="middle" font-family="Instrument Sans, sans-serif" font-size="6" font-weight="600" fill="#1d1a15">DISC</text></svg>'
  };

  /* ---------------- state ---------------- */

  var phase = "idle";        // idle | submitting | done
  var controller = null;     // AbortController for the in-flight order
  var slowTimer = null;
  var shown = {};            // key -> its error may be displayed
  var serverErr = {};        // key -> message returned by the API

  var form = $("checkout"), allFields = $("allFields"), placeBtn = $("place"),
      cancelBtn = $("cancel"), formError = $("formError"), formErrorMsg = $("formErrorMsg"),
      retryBtn = $("retry"), slowNote = $("slowNote"), live = $("live"), cartEl = $("cart");

  function input(k) { return $(k); }
  function fieldEl(k) { return document.querySelector('.field[data-field="' + k + '"]'); }
  function ruleError(k) { return RULES[k](input(k).value.trim()); }
  function errorFor(k) { return serverErr[k] || ruleError(k); }

  /* ---------------- painting ---------------- */

  function paintField(k) {
    var f = fieldEl(k), el = input(k), box = $("err-" + k), state = f.querySelector(".state");
    var msg = errorFor(k);
    var visible = shown[k] ? msg : null;
    f.classList.toggle("invalid", !!visible);
    el.setAttribute("aria-invalid", visible ? "true" : "false");
    if (visible) {
      box.innerHTML = ICON_BAD + "<span></span>";
      box.lastChild.textContent = visible;
      box.hidden = false;
      state.innerHTML = ICON_BAD;
    } else {
      box.hidden = true;
      box.textContent = "";
      state.innerHTML = (!msg && el.value.trim()) ? ICON_OK : "";
    }
  }
  function paintAllFields() { KEYS.forEach(function (k) { paintField(k); }); }

  function paintProgress() {
    var filled = 0;
    KEYS.forEach(function (k) { if (!ruleError(k)) filled++; });
    $("prog").value = filled;
    $("progText").textContent = filled + " of 9 filled";
    SECTIONS.forEach(function (s) {
      var done = s.keys.every(function (k) { return !ruleError(k); });
      $(s.el).classList.toggle("done", done);
    });
  }

  function paintTotals() {
    var ship = shipping(), g = grand(), sub = subtotal();
    var display = g == null ? fmt(sub) + "+" : fmt(g);
    $("tSub").textContent = fmt(sub);
    $("tShip").textContent = ship == null ? "Choose a country" : fmt(ship);
    $("tGrand").textContent = display;
    $("sumTotal").textContent = cart.length ? display : fmt(0);
    $("btnTotal").textContent = cart.length ? display : fmt(0);
  }

  function paintCart() {
    var box = $("lines"), busy = phase === "submitting";
    box.textContent = "";
    if (!cart.length) {
      var p = document.createElement("p");
      p.className = "empty";
      p.textContent = "Your basket is empty.";
      box.appendChild(p);
      $("totals").hidden = true;
      paintTotals();
      placeBtn.disabled = true;
      return;
    }
    $("totals").hidden = false;
    cart.forEach(function (item) {
      var row = document.createElement("div");
      row.className = "line";
      row.innerHTML =
        '<span class="tile"><svg viewBox="0 0 44 44" aria-hidden="true"><rect width="44" height="44" fill="' + item.tint + '"/>' +
          '<text x="22" y="29" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="20" fill="#1f5d4c">' + item.glyph + '</text></svg></span>' +
        '<span><p class="nm"></p><p class="vr"></p>' +
          '<span class="qty">' +
            '<button type="button" data-act="dec" aria-label="One fewer"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 5h6"/></svg></button>' +
            '<span class="n"></span>' +
            '<button type="button" data-act="inc" aria-label="One more"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 2v6M2 5h6"/></svg></button>' +
          '</span>' +
          '<button type="button" class="rm" data-act="rm">Remove</button>' +
        '</span>' +
        '<span class="amt"></span>';
      row.querySelector(".nm").textContent = item.name;
      row.querySelector(".vr").textContent = item.variant + " \u00b7 " + fmt(item.unit) + " each";
      row.querySelector(".n").textContent = item.qty;
      row.querySelector(".amt").textContent = fmt(item.unit * item.qty);
      row.querySelector('[data-act="dec"]').disabled = busy || item.qty <= 1;
      row.querySelector('[data-act="inc"]').disabled = busy || item.qty >= 9;
      row.querySelector('[data-act="rm"]').disabled = busy;
      Array.prototype.forEach.call(row.querySelectorAll("button"), function (b) {
        b.addEventListener("click", function () {
          if (phase === "submitting") return;
          var act = b.getAttribute("data-act");
          if (act === "inc") item.qty = Math.min(9, item.qty + 1);
          else if (act === "dec") item.qty = Math.max(1, item.qty - 1);
          else cart = cart.filter(function (x) { return x.id !== item.id; });
          paintCart();
        });
      });
      box.appendChild(row);
    });
    paintTotals();
    placeBtn.disabled = busy;
  }

  function setPhase(p) {
    phase = p;
    var busy = p === "submitting";
    allFields.disabled = busy;
    placeBtn.classList.toggle("busy", busy);
    placeBtn.setAttribute("aria-busy", busy ? "true" : "false");
    cancelBtn.hidden = !busy;
    clearTimeout(slowTimer);
    slowNote.hidden = true;
    if (busy) slowTimer = setTimeout(function () { slowNote.hidden = false; }, 5000);
    live.textContent = busy ? "Placing order" : "";
    paintCart();
  }

  function showBanner(kind, msg, withRetry) {
    formError.className = "banner " + (kind === "info" ? "info" : "bad");
    formErrorMsg.textContent = msg;
    retryBtn.hidden = !withRetry;
    formError.hidden = false;
  }
  function hideBanner() {
    formError.hidden = true;
    retryBtn.hidden = true;
    formErrorMsg.textContent = "";
  }

  /* ---------------- input wiring ---------------- */

  KEYS.forEach(function (k) {
    var el = input(k);
    el.addEventListener("input", function () {
      fieldEl(k).classList.remove("loading");
      delete serverErr[k];
      if (k === "cardNumber") {
        var isAmex = brandOf(el.value) === "amex";
        var d = digits(el.value).slice(0, isAmex ? 15 : 16);
        var groups = isAmex ? [4, 6, 5] : [4, 4, 4, 4];
        var out = [], i = 0;
        groups.forEach(function (g) { if (i < d.length) { out.push(d.substr(i, g)); i += g; } });
        el.value = out.join(" ");
        var b = brandOf(d);
        $("brand").innerHTML = b ? BRANDS[b] : "";
        $("brand").classList.toggle("on", !!b);
        $("lbl-cvc").textContent = b === "amex" ? "CID" : "CVC";
        input("cardCvc").maxLength = b === "amex" ? 4 : 3;
        input("cardCvc").placeholder = b === "amex" ? "1234" : "123";
        if (shown.cardCvc) paintField("cardCvc");
      }
      if (k === "cardExpiry") {
        var e = digits(el.value).slice(0, 4);
        el.value = e.length > 2 ? e.slice(0, 2) + "/" + e.slice(2) : e;
      }
      if (k === "cardCvc") {
        el.value = digits(el.value).slice(0, brandOf(input("cardNumber").value) === "amex" ? 4 : 3);
      }
      if (shown[k]) paintField(k);
      paintProgress();
    });
    el.addEventListener("blur", function () {
      if (el.value.trim()) shown[k] = true;
      paintField(k);
    });
    el.addEventListener("change", function () {
      if (k === "country") {
        $("lbl-postal").textContent = POSTAL_LABEL[el.value] || "Postal code";
        delete serverErr.postalCode;
        if (shown.postalCode) paintField("postalCode");
        paintTotals();
      }
      paintProgress();
    });
  });

  var booted = false;
  function syncCartOpen() {
    var desktop = window.matchMedia("(min-width: 901px)").matches;
    if (desktop) cartEl.open = true;
    else if (!booted) cartEl.open = false;
  }
  window.addEventListener("resize", syncCartOpen);

  /* ---------------- submit ---------------- */

  function payload() {
    return {
      email: input("email").value.trim(),
      name: input("name").value.trim(),
      address1: input("address1").value.trim(),
      city: input("city").value.trim(),
      postalCode: input("postalCode").value.trim(),
      country: input("country").value,
      cardNumber: digits(input("cardNumber").value),
      cardExpiry: input("cardExpiry").value.trim(),
      cardCvc: digits(input("cardCvc").value),
      items: cart.map(function (i) { return { id: i.id, name: i.name, qty: i.qty, unitPrice: i.unit }; })
    };
  }

  function applyServerErrors(fields) {
    var mapped = [], other = [];
    Object.keys(fields).forEach(function (k) {
      if (KEYS.indexOf(k) >= 0) { serverErr[k] = String(fields[k]); shown[k] = true; mapped.push(k); }
      else other.push(fields[k]);
    });
    mapped.forEach(function (k) { paintField(k); });
    var msg = mapped.length
      ? "The shop rejected " + mapped.length + (mapped.length === 1 ? " field, marked below." : " fields, marked below.")
      : "";
    if (other.length) msg = (msg ? msg + " " : "") + other.join(" \u00b7 ");
    showBanner("bad", msg, false);
    if (mapped.length) {
      var first = input(mapped[0]);
      first.focus({ preventScroll: true });
      first.scrollIntoView({ behavior: "smooth", block: "center" });
    }
    live.textContent = msg;
  }

  function doSubmit() {
    if (phase !== "idle") return;               // one order in flight at a time
    hideBanner();
    serverErr = {};                             // last attempt's server verdict is stale
    paintAllFields();

    if (!cart.length) { showBanner("bad", "Add an item before paying.", false); return; }

    var bad = KEYS.filter(function (k) { return !!ruleError(k); });
    if (bad.length) {
      bad.forEach(function (k) { shown[k] = true; });
      paintAllFields();
      var f = input(bad[0]);
      f.focus({ preventScroll: true });
      f.scrollIntoView({ behavior: "smooth", block: "center" });
      var m = bad.length === 1 ? "One field needs fixing." : bad.length + " fields need fixing.";
      showBanner("bad", m, false);
      live.textContent = m;
      return;
    }

    if (!api || typeof api.submitOrder !== "function") {
      showBanner("bad", "The shop is unreachable from this page.", false);
      return;
    }

    var snapshot = {
      total: grand(),
      items: cart.reduce(function (n, i) { return n + i.qty; }, 0),
      email: input("email").value.trim(),
      city: input("city").value.trim(),
      country: input("country").value
    };

    setPhase("submitting");                      // synchronous: the busy state paints before any await
    controller = new AbortController();

    api.submitOrder(payload(), { signal: controller.signal }).then(function (res) {
      controller = null;
      setPhase("done");                          // only after the server confirms
      showDone(res && res.orderId ? res.orderId : "\u2014", snapshot);
    }, function (err) {
      controller = null;
      setPhase("idle");
      if (err && (err.name === "AbortError" || err.code === 20)) {
        showBanner("info", "Cancelled. Your card was not charged.", false);
        live.textContent = "Order cancelled";
      } else if (err && err.code === "VALIDATION" && err.fields) {
        applyServerErrors(err.fields);
      } else if (err && err.code === "NETWORK") {
        showBanner("bad", "Could not reach the shop. Your card was not charged.", true);
        live.textContent = "Network error, order not placed";
      } else {
        showBanner("bad", "The order could not be placed" + (err && err.message ? ": " + err.message : "."), true);
        live.textContent = "Order failed";
      }
    });
  }

  form.addEventListener("submit", function (e) { e.preventDefault(); doSubmit(); });
  retryBtn.addEventListener("click", doSubmit);
  cancelBtn.addEventListener("click", function () {
    if (controller) { try { controller.abort(); } catch (e) { /* already settled */ } }
  });

  /* ---------------- confirmation ---------------- */

  function showDone(orderId, snap) {
    $("confId").textContent = orderId;
    $("confEmail").textContent = snap.email;
    $("confItems").textContent = snap.items + (snap.items === 1 ? " item" : " items");
    $("confTotal").textContent = snap.total == null ? "\u2014" : fmt(snap.total);
    $("confShip").textContent = snap.city + ", " + snap.country;
    $("main").hidden = true;
    $("confirmation").hidden = false;
    $("doneTitle").focus();
    live.textContent = "Order placed, " + orderId;
    window.scrollTo(0, 0);
  }

  $("startOver").addEventListener("click", function () {
    $("confirmation").hidden = true;
    $("main").hidden = false;
    form.reset();
    shown = {};
    serverErr = {};
    $("brand").innerHTML = "";
    $("brand").classList.remove("on");
    $("lbl-postal").textContent = "Postal code";
    $("lbl-cvc").textContent = "CVC";
    input("cardCvc").maxLength = 3;
    input("cardCvc").placeholder = "123";
    $("hint-email").hidden = true;
    hideBanner();
    resetCart();
    setPhase("idle");
    paintAllFields();
    paintProgress();
    prefill();
    window.scrollTo(0, 0);
  });

  /* ---------------- prefill from the signed-in account ---------------- */

  function prefill() {
    if (!api || typeof api.getUser !== "function") return;
    var mail = fieldEl("email"), nm = fieldEl("name");
    mail.classList.add("loading");
    nm.classList.add("loading");
    input("email").setAttribute("aria-busy", "true");
    var clear = function () {
      mail.classList.remove("loading");
      nm.classList.remove("loading");
      input("email").removeAttribute("aria-busy");
    };
    api.getUser().then(function (user) {
      if (user && user.email && !input("email").value) {
        input("email").value = user.email;
        $("hint-email").hidden = false;
      }
      if (user && user.name && !input("name").value) input("name").value = user.name;
      paintField("email");
      paintField("name");
      paintProgress();
      clear();
    }, function () {
      clear();   // prefill is a convenience; the fields stay typeable
    });
  }

  /* ---------------- boot ---------------- */

  syncCartOpen();
  booted = true;
  setPhase("idle");
  paintProgress();
  prefill();
})();
</script>
</body>
</html>
